<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>EOTS — Visual UI Translator</title>

<style>
:root{
  --eots-bg:rgba(5,1,10,.96);
  --eots-panel:rgba(18,12,25,.96);
  --eots-line:#3b2948;
  --eots-cyan:#00f5ff;
  --eots-green:#4ade80;
  --eots-pink:#ff2aa8;
  --eots-text:#f4f4f5;
  --eots-muted:#9ca3af;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
}

/* =========================================================
   DEMO UI
   EOTS kann später auf eine beliebige bestehende UI gelegt
   werden. Dieser Bereich dient nur zum Testen.
   ========================================================= */

.demo{
  min-height:100vh;
  background:#08080a;
  color:white;
  padding:24px;
}

.demo h1{
  margin:0 0 8px;
}

.demo p{
  color:#999;
}

.demo-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-top:30px;
}

.demo-card{
  border:1px solid #29292d;
  border-radius:14px;
  padding:20px;
  background:#111115;
}

.demo-button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  background:#00f5ff;
  color:#001014;
  font-weight:bold;
}

/* =========================================================
   EOTS
   ========================================================= */

#eots{
  position:fixed;
  inset:0;
  z-index:999999;
  pointer-events:none;
  display:none;
}

#eots.active{
  display:block;
}

/* Abdunklung */

#eotsShade{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.18);
  pointer-events:none;
}

/* Auswahlrahmen */

#eotsBox{
  position:fixed;
  display:none;
  border:2px solid var(--eots-cyan);
  box-shadow:
    0 0 0 1px rgba(0,245,255,.25),
    0 0 20px rgba(0,245,255,.35);
  pointer-events:none;
}

#eotsBoxLabel{
  position:absolute;
  left:-2px;
  top:-27px;
  background:var(--eots-cyan);
  color:#001014;
  padding:5px 8px;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
}

/* Bedienpanel */

#eotsPanel{
  position:fixed;
  right:16px;
  bottom:16px;
  width:min(390px,calc(100vw - 32px));
  max-height:calc(100vh - 32px);
  overflow:auto;

  background:var(--eots-bg);
  border:1px solid var(--eots-line);
  border-radius:18px;

  box-shadow:
    0 20px 80px rgba(0,0,0,.65),
    0 0 30px rgba(0,245,255,.08);

  color:var(--eots-text);
  pointer-events:auto;

  padding:16px;
}

.eots-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.eots-logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:bold;
}

.eots-eye{
  width:12px;
  height:12px;
  border:2px solid var(--eots-cyan);
  border-radius:50%;
  box-shadow:0 0 10px var(--eots-cyan);
}

.eots-close{
  border:1px solid #3b2948;
  background:#151019;
  color:#aaa;
  border-radius:8px;
  padding:6px 9px;
  cursor:pointer;
}

.eots-status{
  font-size:12px;
  color:var(--eots-muted);
  margin-bottom:12px;
}

.eots-status strong{
  color:var(--eots-green);
}

.eots-section{
  border-top:1px solid #29202f;
  padding-top:12px;
  margin-top:12px;
}

.eots-title{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#888;
  margin-bottom:8px;
}

.eots-value{
  background:#0b0b0e;
  border:1px solid #29292f;
  border-radius:9px;
  padding:10px;
  font-size:12px;
  line-height:1.5;
  word-break:break-word;
}

.eots-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.eots-btn{
  border:1px solid #3b2948;
  background:#151019;
  color:white;
  padding:11px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.eots-btn:hover{
  border-color:var(--eots-cyan);
}

.eots-btn.primary{
  background:var(--eots-cyan);
  border-color:var(--eots-cyan);
  color:#001014;
}

.eots-btn.green{
  background:var(--eots-green);
  border-color:var(--eots-green);
  color:#031008;
}

.eots-btn.pink{
  border-color:var(--eots-pink);
  color:#ff8bca;
}

#eotsOutput{
  width:100%;
  min-height:180px;
  resize:vertical;

  background:#050507;
  color:#c9faff;

  border:1px solid #29292f;
  border-radius:9px;

  padding:10px;

  font-family:monospace;
  font-size:11px;
  line-height:1.45;
}

/* kleines Start-Element */

#eotsLauncher{
  position:fixed;
  right:18px;
  top:18px;
  z-index:999998;

  width:46px;
  height:46px;

  border-radius:50%;
  border:1px solid var(--eots-cyan);

  background:#080b0d;
  color:var(--eots-cyan);

  cursor:pointer;

  box-shadow:
    0 0 18px rgba(0,245,255,.25);

  font-size:18px;
}

#eotsLauncher.active{
  background:var(--eots-cyan);
  color:#001014;
}

/* Mobile */

@media(max-width:600px){

  #eotsPanel{
    right:8px;
    bottom:8px;
    width:calc(100vw - 16px);
    max-height:70vh;
  }

  #eotsLauncher{
    right:12px;
    top:12px;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     BEISPIEL-UI
     ======================================================= -->

<main class="demo">

  <h1>Meine Anwendung</h1>

  <p>
    Diese Oberfläche ist nur Testmaterial für EOTS.
    EOTS kann darübergelegt werden.
  </p>

  <div class="demo-grid">

    <section class="demo-card">
      <h3>Projekt</h3>
      <p>Aktuelles Projekt öffnen.</p>
      <button class="demo-button">
        Projekt öffnen
      </button>
    </section>

    <section class="demo-card">
      <h3>Datenbank</h3>
      <p>Datensätze verwalten.</p>
      <button class="demo-button">
        Datenbank öffnen
      </button>
    </section>

    <section class="demo-card">
      <h3>Analyse</h3>
      <p>Systemanalyse starten.</p>
      <button class="demo-button">
        Analyse starten
      </button>
    </section>

  </div>

</main>


<!-- =======================================================
     EOTS LAUNCHER
     ======================================================= -->

<button id="eotsLauncher"
        aria-label="EOTS öffnen"
        title="EOTS">
  ◉
</button>


<!-- =======================================================
     EOTS OVERLAY
     ======================================================= -->

<div id="eots">

  <div id="eotsShade"></div>

  <div id="eotsBox">
    <div id="eotsBoxLabel">
      EOTS
    </div>
  </div>

  <aside id="eotsPanel">

    <div class="eots-header">

      <div class="eots-logo">
        <span class="eots-eye"></span>
        <span>EOTS</span>
      </div>

      <button class="eots-close"
              id="eotsClose">
        ×
      </button>

    </div>

    <div class="eots-status">
      Modus:
      <strong id="eotsMode">
        AUS
      </strong>
    </div>


    <div class="eots-section">

      <div class="eots-title">
        Erkanntes Element
      </div>

      <div class="eots-value"
           id="eotsElement">
        Noch kein Element ausgewählt.
      </div>

    </div>


    <div class="eots-section">

      <div class="eots-title">
        Aktionen
      </div>

      <div class="eots-actions">

        <button class="eots-btn primary"
                id="eotsSelect">
          Element markieren
        </button>

        <button class="eots-btn"
                id="eotsAll">
          Alle Buttons
        </button>

        <button class="eots-btn green"
                id="eotsAdd">
          Hinzufügen
        </button>

        <button class="eots-btn pink"
                id="eotsClear">
          Auswahl löschen
        </button>

      </div>

    </div>


    <div class="eots-section">

      <div class="eots-title">
        LLM-Kontext / JSON
      </div>

      <textarea id="eotsOutput"
                spellcheck="false"></textarea>

    </div>


    <div class="eots-section">

      <div class="eots-actions">

        <button class="eots-btn"
                id="eotsCopy">
          JSON kopieren
        </button>

        <button class="eots-btn"
                id="eotsDownload">
          JSON speichern
        </button>

      </div>

    </div>

  </aside>

</div>


<script>
/* =========================================================
   EOTS CORE
   ========================================================= */

(() => {

  "use strict";


  const launcher =
    document.getElementById("eotsLauncher");

  const overlay =
    document.getElementById("eots");

  const panel =
    document.getElementById("eotsPanel");

  const box =
    document.getElementById("eotsBox");

  const boxLabel =
    document.getElementById("eotsBoxLabel");

  const mode =
    document.getElementById("eotsMode");

  const elementView =
    document.getElementById("eotsElement");

  const output =
    document.getElementById("eotsOutput");

  const selectButton =
    document.getElementById("eotsSelect");

  const allButton =
    document.getElementById("eotsAll");

  const addButton =
    document.getElementById("eotsAdd");

  const clearButton =
    document.getElementById("eotsClear");

  const copyButton =
    document.getElementById("eotsCopy");

  const downloadButton =
    document.getElementById("eotsDownload");

  const closeButton =
    document.getElementById("eotsClose");


  let active = false;
  let selecting = false;

  let selectedElements = [];
  let hoveredElement = null;


  /* =======================================================
     EOTS ÖFFNEN / SCHLIESSEN
     ======================================================= */

  function openEOTS(){

    active = true;

    overlay.classList.add("active");
    launcher.classList.add("active");

    mode.textContent =
      "BEREIT";

    mode.style.color =
      "var(--eots-green)";

    document.body.style.cursor =
      "default";
  }


  function closeEOTS(){

    active = false;
    selecting = false;

    overlay.classList.remove("active");
    launcher.classList.remove("active");

    hideBox();

    document.body.style.cursor =
      "default";
  }


  launcher.addEventListener(
    "click",
    () => {

      if(active){
        closeEOTS();
      }else{
        openEOTS();
      }

    }
  );


  closeButton.addEventListener(
    "click",
    closeEOTS
  );


  /* =======================================================
     AUSWAHLMODUS
     ======================================================= */

  selectButton.addEventListener(
    "click",
    () => {

      selecting = !selecting;

      if(selecting){

        mode.textContent =
          "ELEMENT WÄHLEN";

        mode.style.color =
          "var(--eots-cyan)";

        document.body.style.cursor =
          "crosshair";

      }else{

        mode.textContent =
          "BEREIT";

        document.body.style.cursor =
          "default";

        hideBox();

      }

    }
  );


  /* =======================================================
     HOVER
     ======================================================= */

  document.addEventListener(
    "mousemove",
    event => {

      if(!active || !selecting){
        return;
      }

      const target =
        document.elementFromPoint(
          event.clientX,
          event.clientY
        );

      if(!target){
        return;
      }

      /*
       * EOTS selbst darf niemals als UI-Element
       * ausgewählt werden.
       */

      if(
        target.closest("#eots") ||
        target.closest("#eotsLauncher")
      ){
        return;
      }

      hoveredElement = target;

      showBox(target);

    },
    true
  );


  /* =======================================================
     KLICK AUF ELEMENT
     ======================================================= */

  document.addEventListener(
    "click",
    event => {

      if(!active || !selecting){
        return;
      }

      const target =
        event.target;

      if(
        target.closest("#eots") ||
        target.closest("#eotsLauncher")
      ){
        return;
      }

      event.preventDefault();
      event.stopPropagation();

      selectElement(target);

    },
    true
  );


  /* =======================================================
     ELEMENT DARSTELLEN
     ======================================================= */

  function showBox(element){

    const rect =
      element.getBoundingClientRect();

    box.style.display =
      "block";

    box.style.left =
      rect.left + "px";

    box.style.top =
      rect.top + "px";

    box.style.width =
      rect.width + "px";

    box.style.height =
      rect.height + "px";

    boxLabel.textContent =
      describeTag(element);

  }


  function hideBox(){

    box.style.display =
      "none";

  }


  /* =======================================================
     ELEMENT AUSWÄHLEN
     ======================================================= */

  function selectElement(element){

    if(
      element === document.body ||
      element === document.documentElement
    ){
      return;
    }

    const data =
      inspectElement(element);

    const exists =
      selectedElements.some(
        item => item.id === data.id
      );

    if(!exists){

      selectedElements.push(data);

    }

    selecting = false;

    mode.textContent =
      "ELEMENT ERFASST";

    mode.style.color =
      "var(--eots-green)";

    document.body.style.cursor =
      "default";

    showBox(element);

    renderSelection();

  }


  /* =======================================================
     ELEMENT ANALYSIEREN
     ======================================================= */

  function inspectElement(element){

    const rect =
      element.getBoundingClientRect();

    const computed =
      window.getComputedStyle(element);

    const text =
      cleanText(
        element.innerText ||
        element.textContent ||
        ""
      );

    const aria =
      element.getAttribute("aria-label");

    const title =
      element.getAttribute("title");

    const role =
      element.getAttribute("role");

    const id =
      element.id ||
      createElementId(element);

    return {

      id,

      tag:
        element.tagName.toLowerCase(),

      type:
        element.getAttribute("type") || null,

      text:
        text.substring(0,500),

      aria_label:
        aria || null,

      title:
        title || null,

      role:
        role || inferRole(element),

      class:
        typeof element.className === "string"
          ? element.className
          : null,

      position:{
        x:round(rect.left),
        y:round(rect.top)
      },

      size:{
        width:round(rect.width),
        height:round(rect.height)
      },

      visual:{
        display:computed.display,
        visibility:computed.visibility,
        position:computed.position,
        font_size:computed.fontSize,
        border_radius:computed.borderRadius
      },

      interaction:{
        clickable:
          isClickable(element),

        disabled:
          !!element.disabled
      }

    };

  }


  /* =======================================================
     ALLE BUTTONS
     ======================================================= */

  allButton.addEventListener(
    "click",
    () => {

      selectedElements = [];

      const buttons =
        Array.from(
          document.querySelectorAll(
            "button, [role='button'], input[type='button'], input[type='submit']"
          )
        );

      buttons.forEach(
        button => {

          if(
            button.closest("#eots") ||
            button.closest("#eotsLauncher")
          ){
            return;
          }

          selectedElements.push(
            inspectElement(button)
          );

        }
      );

      mode.textContent =
        `${selectedElements.length} ELEMENTE ERFASST`;

      mode.style.color =
        "var(--eots-green)";

      renderSelection();

    }
  );


  /* =======================================================
     HINZUFÜGEN
     ======================================================= */

  addButton.addEventListener(
    "click",
    () => {

      selecting = true;

      mode.textContent =
        "WEITERES ELEMENT WÄHLEN";

      mode.style.color =
        "var(--eots-cyan)";

      document.body.style.cursor =
        "crosshair";

    }
  );


  /* =======================================================
     AUSWAHL LÖSCHEN
     ======================================================= */

  clearButton.addEventListener(
    "click",
    () => {

      selectedElements = [];

      hideBox();

      mode.textContent =
        "AUSWAHL GELÖSCHT";

      mode.style.color =
        "var(--eots-muted)";

      renderSelection();

    }
  );


  /* =======================================================
     JSON ERZEUGEN
     ======================================================= */

  function buildContext(){

    return {

      eots_version:
        "1.0",

      purpose:
        "Visual translation of an existing user interface for LLM understanding",

      source:
        "live_ui",

      captured_at:
        new Date().toISOString(),

      instruction:
        "Describe and reason about the supplied UI elements. Do not invent elements or functions that are not represented by the captured data.",

      elements:
        selectedElements

    };

  }


  function renderSelection(){

    const context =
      buildContext();

    output.value =
      JSON.stringify(
        context,
        null,
        2
      );

    if(selectedElements.length){

      const last =
        selectedElements[
          selectedElements.length - 1
        ];

      elementView.textContent =
        `${last.tag} — ${last.text || last.role || last.id}`;

    }else{

      elementView.textContent =
        "Noch kein Element ausgewählt.";

    }

  }


  /* =======================================================
     KOPIEREN
     ======================================================= */

  copyButton.addEventListener(
    "click",
    async () => {

      try{

        await navigator.clipboard.writeText(
          output.value
        );

        copyButton.textContent =
          "Kopiert ✓";

        setTimeout(
          () => {
            copyButton.textContent =
              "JSON kopieren";
          },
          1200
        );

      }catch(error){

        output.select();

        document.execCommand(
          "copy"
        );

      }

    }
  );


  /* =======================================================
     JSON SPEICHERN
     ======================================================= */

  downloadButton.addEventListener(
    "click",
    () => {

      const blob =
        new Blob(
          [output.value],
          {
            type:"application/json"
          }
        );

      const url =
        URL.createObjectURL(blob);

      const a =
        document.createElement("a");

      a.href =
        url;

      a.download =
        "eots-ui-context.json";

      document.body.appendChild(a);

      a.click();

      a.remove();

      URL.revokeObjectURL(url);

    }
  );


  /* =======================================================
     HILFSFUNKTIONEN
     ======================================================= */

  function cleanText(text){

    return String(text)
      .replace(/\s+/g," ")
      .trim();

  }


  function round(value){

    return Math.round(value * 10) / 10;

  }


  function isClickable(element){

    const tag =
      element.tagName.toLowerCase();

    if(
      ["button","a","input","select","textarea"]
      .includes(tag)
    ){
      return true;
    }

    if(
      element.getAttribute("role") === "button"
    ){
      return true;
    }

    const style =
      window.getComputedStyle(element);

    return style.cursor === "pointer";

  }


  function inferRole(element){

    const tag =
      element.tagName.toLowerCase();

    if(tag === "button"){
      return "button";
    }

    if(tag === "a"){
      return "link";
    }

    if(tag === "input"){
      return "input";
    }

    if(tag === "nav"){
      return "navigation";
    }

    if(
      ["h1","h2","h3","h4","h5","h6"]
      .includes(tag)
    ){
      return "heading";
    }

    return "container";

  }


  function describeTag(element){

    const tag =
      element.tagName.toLowerCase();

    const text =
      cleanText(
        element.innerText ||
        element.textContent ||
        ""
      );

    if(text){
      return `${tag}: ${text.substring(0,40)}`;
    }

    return tag;

  }


  function createElementId(element){

    /*
     * Kein zufälliger LLM-Name.
     * EOTS erzeugt lediglich eine technische lokale ID.
     */

    if(!element.dataset.eotsId){

      element.dataset.eotsId =
        "eots-" +
        Math.random()
          .toString(36)
          .substring(2,10);

    }

    return element.dataset.eotsId;

  }


  /* =======================================================
     INITIALER ZUSTAND
     ======================================================= */

  renderSelection();

})();
</script>

</body>
</html>

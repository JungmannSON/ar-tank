<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AR PANZER // CONTROL</title>
<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
</script>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}
/* =====================================================
   AR / 3D
===================================================== */
model-viewer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    --poster-color: transparent;
}
/* =====================================================
   HUD
===================================================== */
#hud {
    position: fixed;
    left: 14px;
    right: 14px;
    top: calc(
        10px +
        env(safe-area-inset-top)
    );
    z-index: 20;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}
.hudBox {
    padding: 8px 10px;
    background:
        rgba(0,0,0,.70);
    border:
        1px solid
        rgba(0,245,255,.55);
    color: #00f5ff;
    font-size: 10px;
    letter-spacing: 2px;
}
/* =====================================================
   START SCREEN
===================================================== */
#startScreen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 30px;
    background:
        radial-gradient(
            circle at center,
            rgba(0,245,255,.12),
            rgba(0,0,0,.97)
        );
    color: white;
    text-align: center;
}
#startScreen h1 {
    margin: 0;
    color: #00f5ff;
    font-size: 29px;
    letter-spacing: 5px;
}
#startScreen p {
    max-width: 330px;
    color: #aaa;
    line-height: 1.5;
}
#startButton {
    padding: 16px 25px;
    border:
        1px solid
        #00f5ff;
    background:
        #00f5ff;
    color: #000;
    border-radius: 5px;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
}
/* =====================================================
   AR START BUTTON
===================================================== */
#arButton {
    position: fixed;
    left: 50%;
    bottom: 150px;
    transform:
        translateX(-50%);
    z-index: 50;
    padding: 15px 22px;
    border:
        1px solid
        #00f5ff;
    border-radius: 5px;
    background:
        #00f5ff;
    color: #000;
    font-weight: bold;
    letter-spacing: 1px;
}
/* =====================================================
   CONTROLS
===================================================== */
#controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(
        15px +
        env(safe-area-inset-bottom)
    );
    z-index: 40;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 18px;
    pointer-events: none;
}
/* =====================================================
   JOYSTICK
===================================================== */
.joystick {
    width: 115px;
    height: 115px;
    border:
        2px solid
        rgba(0,245,255,.65);
    border-radius: 50%;
    background:
        rgba(0,0,0,.35);
    position: relative;
    pointer-events: auto;
    touch-action: none;
}
.stick {
    position: absolute;
    width: 48px;
    height: 48px;
    left: 50%;
    top: 50%;
    margin-left: -24px;
    margin-top: -24px;
    border:
        2px solid
        #00f5ff;
    border-radius: 50%;
    background:
        rgba(0,245,255,.18);
    box-shadow:
        0 0 15px
        rgba(0,245,255,.35);
    pointer-events: none;
}
/* =====================================================
   RIGHT SIDE
===================================================== */
#rightControls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    pointer-events: none;
}
#fire {
    width: 75px;
    height: 45px;
    border:
        1px solid
        #ff2aa8;
    border-radius: 5px;
    background:
        rgba(0,0,0,.75);
    color: #ff2aa8;
    font-size: 11px;
    font-weight: bold;
    pointer-events: auto;
    touch-action: manipulation;
}
#fire:active {
    background: #ff2aa8;
    color: #000;
}
/* =====================================================
   INFO
===================================================== */
#info {
    position: fixed;
    left: 15px;
    right: 15px;
    bottom: calc(
        145px +
        env(safe-area-inset-bottom)
    );
    z-index: 20;
    padding: 8px;
    background:
        rgba(0,0,0,.65);
    border:
        1px solid
        rgba(0,245,255,.3);
    color: #aaa;
    text-align: center;
    font-size: 10px;
    pointer-events: none;
}
</style>
</head>
<body>
<!-- =====================================================
     PANZER
===================================================== -->

<model-viewer

id="tank"
src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Tank/glTF-Binary/Tank.glb"
alt="3D Panzermodell"
ar
ar-modes="
    webxr
    scene-viewer
    quick-look
"
camera-controls
touch-action="none"
shadow-intensity="1"
exposure="1"
scale="0.3 0.3 0.3"
camera-orbit="
    0deg
    70deg
    4m
"
min-camera-orbit="
    auto
    auto
    1m
"
max-camera-orbit="
    auto
    auto
    10m
">
<button
    id="arButton"
    slot="ar-button">
    PANZER IN AR PLATZIEREN
</button>
</model-viewer>
<!-- =====================================================
     HUD
===================================================== -->
<div id="hud">
<div class="hudBox">
    AR // TANK
</div>
<div
    class="hudBox"
    id="status">
    SYSTEM // READY
</div>
</div>
<!-- =====================================================
     INFO
===================================================== -->
<div id="info">
PANZER LADEN ...
</div>
<!-- =====================================================
     TOUCH CONTROLS
===================================================== -->
<div id="controls">
<!-- LINKER JOYSTICK -->
<div
    class="joystick"
    id="moveJoystick">
    <div
        class="stick"
        id="moveStick">
    </div>
</div>
<!-- RECHTS -->
<div id="rightControls">
    <button id="fire">
        FEUER
    </button>
    <div
        class="joystick"
        id="turretJoystick">
        <div
            class="stick"
            id="turretStick">
        </div>
    </div>
</div>
</div>
<!-- =====================================================
     START
===================================================== -->
<div id="startScreen">
<h1>
    AR // TANK
</h1>
<p>
    Platziere den Panzer
    in deiner realen Umgebung.
    <br><br>
    Danach kannst du ihn
    mit den Touch-Joysticks steuern.
</p>
<button id="startButton">
    PANZER STARTEN
</button>
</div>
<script>
/* =====================================================
   ELEMENTE
===================================================== */
const tank =
    document.getElementById("tank");
const status =
    document.getElementById("status");
const info =
    document.getElementById("info");
const startScreen =
    document.getElementById("startScreen");
const startButton =
    document.getElementById("startButton");
const moveJoystick =
    document.getElementById("moveJoystick");
const moveStick =
    document.getElementById("moveStick");
const turretJoystick =
    document.getElementById("turretJoystick");
const turretStick =
    document.getElementById("turretStick");
const fire =
    document.getElementById("fire");
/* =====================================================
   PANZER-STATE
===================================================== */
const tankState = {
    forward: 0,
    steering: 0,
    turret: 0,
    speed: 0.015,
    turnSpeed: 0.025
};
/* =====================================================
   MODELL GELADEN
===================================================== */
tank.addEventListener(
    "load",
    () => {
        status.textContent =
            "3D // ONLINE";
        info.innerHTML =
            "TANK BEREIT<br>" +
            "AR STARTEN UND AUF FLÄCHE PLATZIEREN.";
        console.log(
            "Animationen:",
            tank.availableAnimations
        );
    }
);
/* =====================================================
   JOYSTICK ENGINE
===================================================== */
function createJoystick(
    joystick,
    stick,
    callback
) {
    let active = false;
    let pointerId = null;
    function update(
        clientX,
        clientY
    ) {
        const rect =
            joystick.getBoundingClientRect();
        const centerX =
            rect.left +
            rect.width / 2;
        const centerY =
            rect.top +
            rect.height / 2;
        let dx =
            clientX -
            centerX;
        let dy =
            clientY -
            centerY;
        const radius =
            rect.width / 2 - 25;
        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );
        if(distance > radius) {
            const factor =
                radius / distance;
            dx *= factor;
            dy *= factor;
        }
        stick.style.transform =
            `translate(${dx}px, ${dy}px)`;
        callback(
            dx / radius,
            -dy / radius
        );
    }
    function reset() {
        active = false;
        pointerId = null;
        stick.style.transform =
            "translate(0px,0px)";
        callback(0,0);
    }
    joystick.addEventListener(
        "pointerdown",
        event => {
            active = true;
            pointerId =
                event.pointerId;
            joystick.setPointerCapture(
                pointerId
            );
            update(
                event.clientX,
                event.clientY
            );
        }
    );
    joystick.addEventListener(
        "pointermove",
        event => {
            if(
                !active ||
                event.pointerId !== pointerId
            )
                return;
            update(
                event.clientX,
                event.clientY
            );
        }
    );
    joystick.addEventListener(
        "pointerup",
        reset
    );
    joystick.addEventListener(
        "pointercancel",
        reset
    );
}
/* =====================================================
   FAHR-JOYSTICK
===================================================== */
createJoystick(
    moveJoystick,
    moveStick,
    (x,y) => {
        tankState.steering =
            x;
        tankState.forward =
            y;
    }
);
/* =====================================================
   TURRET-JOYSTICK
===================================================== */
createJoystick(
    turretJoystick,
    turretStick,
    (x,y) => {
        tankState.turret =
            x;
    }
);
/* =====================================================
   FEUER
===================================================== */
fire.addEventListener(
    "pointerdown",
    () => {
        console.log(
            "FIRE"
        );
        status.textContent =
            "WEAPON // FIRE";
        setTimeout(
            () => {
                status.textContent =
                    "AR // ACTIVE";
            },
            500
        );
    }
);
/* =====================================================
   TANK UPDATE LOOP
===================================================== */
function updateTank() {
    /*
     * HINWEIS:
     *
     * model-viewer stellt das GLB dar.
     *
     * Die tatsächliche Bewegung
     * des AR-Ankers kann über
     * WebXR / Scene Graph erweitert
     * werden.
     *
     * Dieser Loop hält die
     * deterministische Steuerlogik
     * getrennt von der UI.
     */
    if(
        tankState.forward !== 0
    ) {
        console.log(
            "FORWARD:",
            tankState.forward
        );
    }
    if(
        tankState.steering !== 0
    ) {
        console.log(
            "STEERING:",
            tankState.steering
        );
    }
    if(
        tankState.turret !== 0
    ) {
        console.log(
            "TURRET:",
            tankState.turret
        );
    }
    requestAnimationFrame(
        updateTank
    );
}
updateTank();
/* =====================================================
   START
===================================================== */
startButton.addEventListener(
    "click",
    () => {
        startScreen.style.display =
            "none";
    }
);
/* =====================================================
   AR STATUS
===================================================== */
tank.addEventListener(
    "ar-status",
    event => {
        const state =
            event.detail.status;
        console.log(
            "AR:",
            state
        );
        if(
            state ===
            "session-started"
        ) {
            status.textContent =
                "AR // ACTIVE";
            info.innerHTML =
                "PANZER AKTIV<br>" +
                "LINKS = FAHREN · RECHTS = TURRET";
        }
        if(
            state ===
            "not-presenting"
        ) {
            status.textContent =
                "3D // ONLINE";
        }
        if(
            state ===
            "failed"
        ) {
            status.textContent =
                "AR // FAILED";
            info.innerHTML =
                "AR konnte nicht gestartet werden.";
        }
    }
);
/* =====================================================
   FEHLER
===================================================== */
tank.addEventListener(
    "error",
    () => {
        status.textContent =
            "3D // ERROR";
        info.innerHTML =
            "Tank.glb konnte nicht geladen werden.";
    }
);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CUBE-01 // AR</title>
<script type="module"
  src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
</script>
<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}
model-viewer {
    width: 100%;
    height: 100%;
    background: transparent;
}
#start {
    position: fixed;
    z-index: 10;
    left: 50%;
    bottom: 35px;
    transform: translateX(-50%);
    padding: 15px 22px;
    border: 1px solid #00f5ff;
    background: rgba(0,10,14,.9);
    color: #00f5ff;
    font-family: monospace;
    font-size: 12px;
    letter-spacing: 2px;
}
#status {
    position: fixed;
    z-index: 20;
    top: 25px;
    left: 20px;
    color: #00f5ff;
    font-family: monospace;
    font-size: 11px;
}
</style>
</head>
<body>
<div id="status">
    CUBE-01 // INITIALIZING
</div>
<button
    id="start"
    slot="ar-button">
    🧊 CUBE-01 IN AR
</button>
</model-viewer>
<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import { GLTFExporter } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/exporters/GLTFExporter.js";
/* =====================================================
   THREE.JS SZENE
===================================================== */
const scene =
    new THREE.Scene();
/* =====================================================
   CUBE-01
===================================================== */
const artifact =
    new THREE.Group();
scene.add(artifact);
/* =====================================================
   MATERIALIEN
===================================================== */
const dark =
    new THREE.MeshStandardMaterial({
        color: 0x11181b,
        metalness: .9,
        roughness: .18
    });
const cyan =
    new THREE.MeshStandardMaterial({
        color: 0x00f5ff,
        emissive: 0x00f5ff,
        emissiveIntensity: 3,
        metalness: .2,
        roughness: .25
    });
/* =====================================================
   CORE
===================================================== */
const core =
    new THREE.Mesh(
        new THREE.IcosahedronGeometry(
            .45,
            1
        ),
        dark
    );
artifact.add(core);
/* =====================================================
   ENERGY CORE
===================================================== */
const energyCore =
    new THREE.Mesh(
        new THREE.IcosahedronGeometry(
            .18,
            1
        ),
        cyan
    );
artifact.add(
    energyCore
);
/* =====================================================
   CUBE-RAHMEN
===================================================== */
function bar(
    x,
    y,
    z,
    rx,
    ry,
    rz
) {
    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.7,
                .07,
                .07
            ),
            dark
        );
    mesh.position.set(
        x,
        y,
        z
    );
    mesh.rotation.set(
        rx,
        ry,
        rz
    );
    artifact.add(mesh);
}
/* oben */
bar(
    0,
    .85,
    0,
    0,
    0,
    0
);
/* unten */
bar(
    0,
    -.85,
    0,
    0,
    0,
    0
);
/* links */
bar(
    -.85,
    0,
    0,
    0,
    0,
    Math.PI / 2
);
/* rechts */
bar(
    .85,
    0,
    0,
    0,
    0,
    Math.PI / 2
);
/* vorne */
bar(
    0,
    0,
    .85,
    0,
    Math.PI / 2,
    0
);
/* hinten */
bar(
    0,
    0,
    -.85,
    0,
    Math.PI / 2,
    0
);
/* =====================================================
   LIGHT
===================================================== */
scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x222222,
        2
    )
);
/* =====================================================
   EXPORT
===================================================== */
const exporter =
    new GLTFExporter();
const status =
    document.getElementById(
        "status"
    );
status.textContent =
    "CUBE-01 // BUILDING AR MODEL";
exporter.parse(
    artifact,
    result => {
        let blob;
        if (
            result instanceof ArrayBuffer
        ) {
            blob =
                new Blob(
                    [result],
                    {
                        type:
                        "model/gltf-binary"
                    }
                );
        }
        else {
            blob =
                new Blob(
                    [
                        JSON.stringify(
                            result
                        )
                    ],
                    {
                        type:
                        "model/gltf+json"
                    }
                );
        }
        const url =
            URL.createObjectURL(
                blob
            );
        const viewer =
            document.getElementById(
                "ar"
            );
        viewer.src =
            url;
        viewer.addEventListener(
            "load",
            () => {
                status.textContent =
                    "CUBE-01 // AR READY";
            },
            {
                once: true
            }
        );
    },
    error => {
        console.error(error);
        status.textContent =
            "CUBE-01 // EXPORT ERROR";
    },
    {
        binary: true
    }
);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BRUCHWIESEN WORLD ENGINE 3.1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap');
  :root {
    --bg:#0a0c12; --panel:#10141e; --cyan:#00e5ff; --green:#00ff9d;
    --magenta:#ff2d78; --yellow:#ffc107; --red:#ff3b5c;
    --text:#e8f0ff; --dim:#5a6a80; --border:#1c2535;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;overflow:hidden;touch-action:none}
  .app{display:flex;flex-direction:column;height:100%;height:100dvh}
  .top{height:46px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 10px;flex-shrink:0;gap:6px}
  .logo{font-family:Orbitron,sans-serif;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--cyan);white-space:nowrap}
  .top-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .btn{height:30px;padding:0 9px;border-radius:5px;border:1px solid #1e3a5f;background:#0f1c2e;color:var(--cyan);font-size:10px;font-family:inherit;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  .btn:active{opacity:.7}
  .btn.play{border-color:var(--magenta);color:var(--magenta)}
  .btn.ok{border-color:var(--green);color:var(--green)}
  .main{flex:1;display:flex;overflow:hidden}
  .view{flex:1;position:relative;overflow:hidden;background:#07090f}
  canvas{position:absolute;transform-origin:0 0;image-rendering:pixelated}
  .side{width:160px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;font-size:11px;overflow:hidden}
  .side-sec{padding:8px 10px;border-bottom:1px solid var(--border)}
  .side-title{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  .status{height:26px;background:#080c14;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:10px;color:var(--dim);flex-shrink:0}
  .info{font-size:11px;color:var(--dim);line-height:1.4}
  .feature{padding:5px 0;border-bottom:1px solid #1a2230;font-size:10px;cursor:pointer}
  .feature:active,.feature.sel{background:#0c1a28}
  .feature .n{color:var(--text)}
  .feature .t{color:var(--dim);font-size:9px}
  .feature.uncertain .n{color:var(--yellow)}
  #fileJson{display:none}
  .drop{border:1px dashed #1e3a5f;border-radius:6px;padding:10px 6px;text-align:center;color:var(--dim);font-size:10px;margin-bottom:6px}
  .drop.active{border-color:var(--cyan);color:var(--cyan)}
  .err{color:var(--red);font-size:10px;margin-top:4px;line-height:1.3}
  .okmsg{color:var(--green);font-size:10px;margin-top:4px}
  /* JSON paste modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal.show{display:flex}
  .modal-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column}
  .modal-head{padding:12px 14px;border-bottom:1px solid var(--border);font-family:Orbitron,sans-serif;font-size:12px;color:var(--cyan)}
  .modal-body{padding:12px 14px;flex:1;overflow:auto}
  .modal-body textarea{width:100%;height:180px;background:#080c14;border:1px solid #1a2a40;border-radius:6px;color:var(--text);padding:10px;font-size:12px;font-family:inherit;resize:vertical}
  .modal-foot{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
  @media(max-width:480px){.side{width:130px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">WORLD ENGINE 3.1</div>
    <div class="top-actions">
      <button class="btn" id="btnJson">JSON</button>
      <button class="btn" id="btnPaste">PASTE</button>
      <button class="btn" id="btnExample">EXAMPLE</button>
      <button class="btn" id="btnExport">EXPORT</button>
      <button class="btn play" id="btnPlay">▶ PLAY</button>
    </div>
  </div>

  <div class="main">
    <div class="view" id="view">
      <canvas id="c"></canvas>
    </div>
    <div class="side">
      <div class="side-sec">
        <div class="side-title">Import</div>
        <div class="drop" id="drop">BW_WORLD.json<br>ablegen / tippen</div>
        <button class="btn" id="btnLoad" style="width:100%;margin-bottom:4px">DATEI</button>
        <div id="importMsg"></div>
      </div>
      <div class="side-sec">
        <div class="side-title">Welt</div>
        <div class="info" id="worldInfo">Kein JSON geladen</div>
      </div>
      <div class="side-sec" style="flex:1;overflow:auto">
        <div class="side-title">Features</div>
        <div id="featureList"></div>
      </div>
    </div>
  </div>

  <div class="status">
    <span id="status">Warte auf BW_WORLD.json v1.0</span>
    <span id="zoom">100%</span>
  </div>
</div>

<!-- Paste Modal -->
<div class="modal" id="pasteModal">
  <div class="modal-box">
    <div class="modal-head">JSON EINFÜGEN</div>
    <div class="modal-body">
      <textarea id="pasteArea" placeholder="BW_WORLD.json hier einfügen…"></textarea>
      <div id="pasteErr" class="err"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="btnPasteCancel">ABBRECHEN</button>
      <button class="btn ok" id="btnPasteOk">LADEN</button>
    </div>
  </div>
</div>

<input type="file" id="fileJson" accept="application/json,.json">

<script>
(function(){
  "use strict";

  const SCHEMA_VERSION = "1.0";

  let world = null;
  let selectedId = null;
  let scale = 1, ox = 0, oy = 0;
  let canvasW = 1000, canvasH = 800;
  let boundsW = 10000, boundsH = 10000;

  // pan state
  let panning = false;
  let panStartX = 0, panStartY = 0, panOrigX = 0, panOrigY = 0;
  let lastTap = 0;

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const view = document.getElementById("view");
  const statusEl = document.getElementById("status");
  const zoomEl = document.getElementById("zoom");
  const worldInfo = document.getElementById("worldInfo");
  const featureList = document.getElementById("featureList");
  const drop = document.getElementById("drop");
  const fileJson = document.getElementById("fileJson");
  const importMsg = document.getElementById("importMsg");
  const pasteModal = document.getElementById("pasteModal");
  const pasteArea = document.getElementById("pasteArea");
  const pasteErr = document.getElementById("pasteErr");

  // ===== COORDINATES (fixed: uses bounds) =====
  function toCanvasX(x) {
    return ((x - (world?.world?.bounds?.x || 0)) / boundsW) * canvasW;
  }
  function toCanvasY(y) {
    return ((y - (world?.world?.bounds?.y || 0)) / boundsH) * canvasH;
  }

  // ===== POINT IN POLYGON (ray casting) =====
  function pointInPoly(x, y, points) {
    let inside = false;
    for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
      const xi = points[i][0], yi = points[i][1];
      const xj = points[j][0], yj = points[j][1];
      const intersect = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / (yj - yi + 0.0000001) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  // ===== VALIDATION (stricter) =====
  function validate(data) {
    const errors = [];
    if (!data || typeof data !== "object") {
      errors.push("Root muss ein Objekt sein");
      return errors;
    }
    if (data.schemaVersion !== SCHEMA_VERSION) {
      errors.push(`schemaVersion muss "${SCHEMA_VERSION}" sein (gefunden: ${data.schemaVersion})`);
    }
    if (!data.meta || typeof data.meta !== "object") {
      errors.push("meta fehlt");
    } else if (typeof data.meta.imageAspect !== "number" || data.meta.imageAspect <= 0) {
      errors.push("meta.imageAspect muss eine positive Zahl sein");
    }
    if (!data.world || !data.world.bounds) {
      errors.push("world.bounds fehlt");
    } else {
      const b = data.world.bounds;
      if (typeof b.w !== "number" || typeof b.h !== "number" || b.w <= 0 || b.h <= 0) {
        errors.push("world.bounds.w/h müssen positive Zahlen sein");
      }
    }
    if (!data.materials || typeof data.materials !== "object") {
      errors.push("materials fehlt");
    }
    if (!Array.isArray(data.features)) {
      errors.push("features muss ein Array sein");
    } else {
      const ids = new Set();
      data.features.forEach((f, i) => {
        if (!f.id || typeof f.id !== "string") {
          errors.push(`features[${i}]: id fehlt oder ist kein String`);
        } else if (ids.has(f.id)) {
          errors.push(`features[${i}]: doppelte id "${f.id}"`);
        } else {
          ids.add(f.id);
        }
        if (!f.geometry || !f.geometry.kind) {
          errors.push(`features[${i}]: geometry.kind fehlt`);
        } else {
          const g = f.geometry;
          if (!["polygon", "linestring", "point"].includes(g.kind)) {
            errors.push(`features[${i}]: unbekannte geometry.kind "${g.kind}"`);
          }
          if (!Array.isArray(g.points) || g.points.length === 0) {
            errors.push(`features[${i}]: geometry.points fehlt oder leer`);
          } else {
            if (g.kind === "polygon" && g.points.length < 3) {
              errors.push(`features[${i}]: polygon braucht ≥ 3 Punkte`);
            }
            if (g.kind === "linestring" && g.points.length < 2) {
              errors.push(`features[${i}]: linestring braucht ≥ 2 Punkte`);
            }
            g.points.forEach((p, pi) => {
              if (!Array.isArray(p) || p.length < 2 || typeof p[0] !== "number" || typeof p[1] !== "number") {
                errors.push(`features[${i}].points[${pi}] ungültig`);
              } else if (p[0] < 0 || p[0] > 10000 || p[1] < 0 || p[1] > 10000) {
                errors.push(`features[${i}].points[${pi}] außerhalb 0–10000`);
              }
            });
          }
        }
      });
    }
    if (data.playerStart) {
      if (typeof data.playerStart.x !== "number" || typeof data.playerStart.y !== "number") {
        errors.push("playerStart.x/y müssen Zahlen sein");
      }
    }
    return errors;
  }

  // ===== RENDER =====
  function render() {
    if (!world) return;

    const b = world.world.bounds;
    boundsW = b.w || 10000;
    boundsH = b.h || 10000;

    const aspect = world.meta.imageAspect || (boundsW / boundsH);
    const maxDim = 1100;
    if (aspect >= 1) {
      canvasW = maxDim;
      canvasH = Math.round(maxDim / aspect);
    } else {
      canvasH = maxDim;
      canvasW = Math.round(maxDim * aspect);
    }

    canvas.width = canvasW;
    canvas.height = canvasH;

    ctx.fillStyle = "#1a2f1a";
    ctx.fillRect(0, 0, canvasW, canvasH);

    const typeOrder = ["terrain", "street", "path", "sport", "building", "vegetation", "object", "unknown"];
    const sorted = [...world.features].sort((a, b) => {
      const ta = typeOrder.indexOf(a.type || "unknown");
      const tb = typeOrder.indexOf(b.type || "unknown");
      return (ta < 0 ? 99 : ta) - (tb < 0 ? 99 : tb);
    });

    sorted.forEach(f => {
      const mat = world.materials[f.material] || { color: "#666" };
      const g = f.geometry;
      if (!g || !g.points) return;
      const uncertain = f.properties && f.properties.uncertain;
      const selected = f.id === selectedId;

      if (g.kind === "polygon" && g.points.length >= 3) {
        ctx.beginPath();
        g.points.forEach((p, i) => {
          const x = toCanvasX(p[0]), y = toCanvasY(p[1]);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fillStyle = mat.color;
        ctx.fill();
        ctx.strokeStyle = selected ? "#00e5ff" : (uncertain ? "rgba(255,193,7,0.9)" : "rgba(0,0,0,0.3)");
        ctx.lineWidth = selected ? 2.5 : (uncertain ? 2 : 1);
        ctx.stroke();
      }

      if (g.kind === "linestring" && g.points.length >= 2) {
        const widthPx = Math.max(2, ((g.width || 120) / boundsW) * canvasW);
        ctx.beginPath();
        g.points.forEach((p, i) => {
          const x = toCanvasX(p[0]), y = toCanvasY(p[1]);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = selected ? "#00e5ff" : mat.color;
        ctx.lineWidth = widthPx;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
      }

      if (g.kind === "point" && g.points[0]) {
        const x = toCanvasX(g.points[0][0]);
        const y = toCanvasY(g.points[0][1]);
        const r = Math.max(3, ((g.radius || 80) / boundsW) * canvasW);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = mat.color;
        ctx.fill();
        if (selected) {
          ctx.strokeStyle = "#00e5ff";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
    });

    // player
    if (world.playerStart) {
      const px = toCanvasX(world.playerStart.x);
      const py = toCanvasY(world.playerStart.y);
      ctx.fillStyle = "#00ff9d";
      ctx.beginPath();
      ctx.arc(px, py, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    fit();
  }

  function fit() {
    const vw = view.clientWidth, vh = view.clientHeight;
    scale = Math.min(vw / canvasW, vh / canvasH) * 0.95;
    ox = (vw - canvasW * scale) / 2;
    oy = (vh - canvasH * scale) / 2;
    applyTransform();
  }

  function applyTransform() {
    canvas.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
    zoomEl.textContent = Math.round(scale * 100) + "%";
  }

  // ===== LOAD / VALIDATE =====
  function loadWorld(data) {
    const errors = validate(data);
    importMsg.innerHTML = "";
    if (errors.length) {
      importMsg.innerHTML = `<div class="err">${errors.slice(0, 5).join("<br>")}</div>`;
      setStatus("Validierung fehlgeschlagen");
      return false;
    }

    // keep unknown materials, mark uncertain
    data.features.forEach(f => {
      if (!data.materials[f.material]) {
        f.properties = f.properties || {};
        f.properties.uncertain = true;           // FIXED typo
        data.materials[f.material] = { color: "#888800", walkable: true };
      }
      if (!f.type) f.type = "unknown";
    });

    world = data;
    selectedId = null;
    render();
    updateUI();
    importMsg.innerHTML = `<div class="okmsg">OK – ${data.features.length} Features</div>`;
    setStatus("Welt geladen: " + (data.meta?.name || "Unbenannt"));
    try { localStorage.setItem("bw_world_v31", JSON.stringify(data)); } catch(e) {}
    return true;
  }

  function updateUI() {
    if (!world) return;
    worldInfo.innerHTML = `<b style="color:var(--cyan)">${esc(world.meta?.name||"—")}</b><br>
      ${world.features.length} Features<br>Aspect ${world.meta?.imageAspect}<br>Schema ${world.schemaVersion}`;
    featureList.innerHTML = "";
    world.features.forEach(f => {
      if (f.type === "terrain") return;
      const d = document.createElement("div");
      d.className = "feature" + (f.properties?.uncertain ? " uncertain" : "") + (f.id === selectedId ? " sel" : "");
      d.innerHTML = `<div class="n">${esc(f.name||f.id)}</div><div class="t">${f.type} · ${f.material}</div>`;
      d.onclick = () => {
        selectedId = f.id;
        updateUI();
        render();
        setStatus("Ausgewählt: " + (f.name || f.id));
      };
      featureList.appendChild(d);
    });
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
  }

  // ===== FILE / DROP / PASTE =====
  document.getElementById("btnJson").onclick = () => fileJson.click();
  document.getElementById("btnLoad").onclick = () => fileJson.click();
  drop.onclick = () => fileJson.click();

  fileJson.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { loadWorld(JSON.parse(r.result)); }
      catch (err) { importMsg.innerHTML = `<div class="err">Parse: ${err.message}</div>`; }
    };
    r.readAsText(f);
  };

  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("active"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("active"));
  drop.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("active");
    const f = e.dataTransfer.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { loadWorld(JSON.parse(r.result)); }
      catch (err) { importMsg.innerHTML = `<div class="err">Parse Fehler</div>`; }
    };
    r.readAsText(f);
  });

  // Paste dialog
  document.getElementById("btnPaste").onclick = () => {
    pasteArea.value = "";
    pasteErr.textContent = "";
    pasteModal.classList.add("show");
  };
  document.getElementById("btnPasteCancel").onclick = () => pasteModal.classList.remove("show");
  document.getElementById("btnPasteOk").onclick = () => {
    try {
      const data = JSON.parse(pasteArea.value);
      if (loadWorld(data)) pasteModal.classList.remove("show");
      else pasteErr.textContent = "Validierung fehlgeschlagen – siehe Meldung";
    } catch (err) {
      pasteErr.textContent = "JSON Parse Fehler: " + err.message;
    }
  };

  document.getElementById("btnExample").onclick = () => loadWorld(MINIMAL_VALID_WORLD);

  document.getElementById("btnExport").onclick = () => {
    if (!world) { setStatus("Keine Welt"); return; }
    const blob = new Blob([JSON.stringify(world, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "BW_WORLD_export.json";
    a.click();
    setStatus("Exportiert");
  };

  // ===== PLAY with proper polygon collision =====
  document.getElementById("btnPlay").onclick = () => {
    if (!world) { setStatus("Zuerst JSON laden"); return; }

    const aspect = world.meta.imageAspect || 1.25;
    const GRID_W = 64;
    const GRID_H = Math.max(8, Math.round(GRID_W / aspect));
    const walk = Array.from({length: GRID_H}, () => Array(GRID_W).fill(true));

    // rasterize using point-in-polygon (deterministic)
    world.features.forEach(f => {
      const mat = world.materials[f.material];
      const coll = (f.properties && f.properties.collision === true) || (mat && mat.walkable === false);
      if (!coll) return;
      const g = f.geometry;
      if (!g || g.kind !== "polygon" || !g.points || g.points.length < 3) return;

      // bounding box for speed, then precise test
      let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
      g.points.forEach(p => {
        minX=Math.min(minX,p[0]); maxX=Math.max(maxX,p[0]);
        minY=Math.min(minY,p[1]); maxY=Math.max(maxY,p[1]);
      });
      const c1 = Math.max(0, Math.floor(minX/10000*GRID_W));
      const r1 = Math.max(0, Math.floor(minY/10000*GRID_H));
      const c2 = Math.min(GRID_W-1, Math.floor(maxX/10000*GRID_W));
      const r2 = Math.min(GRID_H-1, Math.floor(maxY/10000*GRID_H));

      for (let r = r1; r <= r2; r++) {
        for (let c = c1; c <= c2; c++) {
          const wx = ((c + 0.5) / GRID_W) * 10000;
          const wy = ((r + 0.5) / GRID_H) * 10000;
          if (pointInPoly(wx, wy, g.points)) walk[r][c] = false;
        }
      }
    });

    const sc = Math.floor(((world.playerStart && world.playerStart.x) || 5000) / 10000 * GRID_W);
    const sr = Math.floor(((world.playerStart && world.playerStart.y) || 5000) / 10000 * GRID_H);

    const playData = {
      name: world.meta?.name || "BRUCHWIESEN",
      gridW: GRID_W, gridH: GRID_H,
      walk, startC: Math.max(0, Math.min(GRID_W-1, sc)),
      startR: Math.max(0, Math.min(GRID_H-1, sr))
    };

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>${playData.name}</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0c12;color:#eee;font-family:monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden;touch-action:none}
.bar{height:36px;background:#10141e;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px}
.view{flex:1;position:relative;overflow:hidden;background:#07090f}
canvas{position:absolute;image-rendering:pixelated}
.hint{text-align:center;padding:5px;font-size:11px;color:#666}</style></head><body>
<div class="bar"><span>${playData.name}</span><span id="p">—</span></div>
<div class="view" id="v"><canvas id="c"></canvas></div>
<div class="hint">Touch = Richtung • WASD / Pfeile</div>
<script>
const D=${JSON.stringify(playData)};
const T=14;const cv=document.getElementById("c"),x=cv.getContext("2d"),v=document.getElementById("v");
cv.width=D.gridW*T;cv.height=D.gridH*T;
let p={c:D.startC,r:D.startR};let sc=1,ox=0,oy=0;
function draw(){
  for(let r=0;r<D.gridH;r++)for(let c=0;c<D.gridW;c++){
    x.fillStyle=D.walk[r][c]?"#3d7a37":"#5a5a6e";x.fillRect(c*T,r*T,T,T);
  }
  x.fillStyle="#00ff9d";x.beginPath();x.arc(p.c*T+T/2,p.r*T+T/2,T/2-1,0,Math.PI*2);x.fill();
  x.strokeStyle="#fff";x.lineWidth=1.5;x.stroke();
  document.getElementById("p").textContent=p.c+","+p.r;
  const vw=v.clientWidth,vh=v.clientHeight;
  sc=Math.max(1.2,Math.min(vw/(D.gridW*T),vh/(D.gridH*T))*1.6);
  ox=vw/2-(p.c*T+T/2)*sc;oy=vh/2-(p.r*T+T/2)*sc;
  cv.style.transform="translate("+ox+"px,"+oy+"px) scale("+sc+")";
}
function mv(dc,dr){const nc=p.c+dc,nr=p.r+dr;if(nc>=0&&nr>=0&&nc<D.gridW&&nr<D.gridH&&D.walk[nr][nc]){p.c=nc;p.r=nr;draw()}}
window.onkeydown=e=>{if(e.key==="ArrowUp"||e.key==="w")mv(0,-1);if(e.key==="ArrowDown"||e.key==="s")mv(0,1);if(e.key==="ArrowLeft"||e.key==="a")mv(-1,0);if(e.key==="ArrowRight"||e.key==="d")mv(1,0)};
v.onclick=e=>{const r=v.getBoundingClientRect();const x0=(e.clientX-r.left-ox)/sc,y0=(e.clientY-r.top-oy)/sc;
const pc=p.c*T+T/2,pr=p.r*T+T/2;const dx=x0-pc,dy=y0-pr;if(Math.abs(dx)>Math.abs(dy))mv(Math.sign(dx),0);else mv(0,Math.sign(dy))};
draw();

  // ===== TOUCH: one-finger pan + pinch zoom =====
  let lastDist = 0, lastMid = null;
  let touches = 0;

  view.addEventListener("touchstart", e => {
    touches = e.touches.length;
    if (e.touches.length === 1) {
      panning = true;
      panStartX = e.touches[0].clientX;
      panStartY = e.touches[0].clientY;
      panOrigX = ox;
      panOrigY = oy;
    } else if (e.touches.length === 2) {
      panning = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastDist = Math.hypot(dx, dy);
      lastMid = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
      };
    }
  }, {passive: true});

  view.addEventListener("touchmove", e => {
    if (e.touches.length === 1 && panning) {
      e.preventDefault();
      ox = panOrigX + (e.touches[0].clientX - panStartX);
      oy = panOrigY + (e.touches[0].clientY - panStartY);
      applyTransform();
    } else if (e.touches.length === 2) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      const mid = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
      };
      const ns = Math.min(Math.max(scale * (dist / lastDist), 0.25), 6);
      const rect = view.getBoundingClientRect();
      const mx = mid.x - rect.left, my = mid.y - rect.top;
      ox = mx - (mx - ox) * (ns / scale);
      oy = my - (my - oy) * (ns / scale);
      scale = ns;
      lastDist = dist;
      if (lastMid) {
        ox += mid.x - lastMid.x;
        oy += mid.y - lastMid.y;
      }
      lastMid = mid;
      applyTransform();
    }
  }, {passive: false});

  view.addEventListener("touchend", () => {
    panning = false;
    touches = 0;
  });

  // desktop wheel + drag pan
  view.addEventListener("wheel", e => {
    e.preventDefault();
    const d = e.deltaY > 0 ? 0.9 : 1.1;
    const ns = Math.min(Math.max(scale * d, 0.25), 6);
    const rect = view.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    ox = mx - (mx - ox) * (ns / scale);
    oy = my - (my - oy) * (ns / scale);
    scale = ns;
    applyTransform();
  }, {passive: false});

  let mousePan = false;
  view.addEventListener("mousedown", e => {
    if (e.button === 0) {
      mousePan = true;
      panStartX = e.clientX;
      panStartY = e.clientY;
      panOrigX = ox;
      panOrigY = oy;
    }
  });
  window.addEventListener("mousemove", e => {
    if (mousePan) {
      ox = panOrigX + (e.clientX - panStartX);
      oy = panOrigY + (e.clientY - panStartY);
      applyTransform();
    }
  });

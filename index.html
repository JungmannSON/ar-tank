<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,
               maximum-scale=1,user-scalable=no">
<title>CUBE-01</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
#scene{
  position:fixed;
  inset:0;
}
#start{
  position:fixed;
  z-index:10;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  padding:18px 25px;
  background:#000;
  border:2px solid #00f5ff;
  color:#00f5ff;
  font-size:16px;
}
</style>
</head>
<body>
<video id="camera"
       autoplay
       playsinline
       muted></video>
<div id="scene"></div>
<button id="start">
  KAMERA STARTEN
</button>
<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
/* =========================
   KAMERA
========================= */
const video =
  document.getElementById("camera");
const start =
  document.getElementById("start");
start.onclick = async () => {
  try {
    const stream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"environment"
        },
        audio:false
      });
    video.srcObject = stream;
    start.style.display = "none";
  } catch(error) {
    alert(
      "Kamera konnte nicht gestartet werden.\n\n" +
      error.message
    );
  }
};
/* =========================
   THREE.JS
========================= */
const scene =
  new THREE.Scene();
const camera =
  new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    0.1,
    100
  );
camera.position.z = 4;
const renderer =
  new THREE.WebGLRenderer({
    alpha:true,
    antialias:true
  });
renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);
renderer.setSize(
  innerWidth,
  innerHeight
);
document
  .getElementById("scene")
  .appendChild(renderer.domElement);
/* =========================
   LICHT
========================= */
scene.add(
  new THREE.AmbientLight(
    0xffffff,
    2
  )
);
/* =========================
   WÜRFEL
========================= */
const geometry =
  new THREE.BoxGeometry(
    1,
    1,
    1
  );
const material =
  new THREE.MeshStandardMaterial({
    color:0x00f5ff,
    emissive:0x00f5ff,
    emissiveIntensity:2,
    metalness:.7,
    roughness:.2
  });
const cube =
  new THREE.Mesh(
    geometry,
    material
  );
scene.add(cube);
/* =========================
   TOUCH
========================= */
let rotationX = 0;
let rotationY = 0;
let lastX = null;
let lastY = null;
renderer.domElement.addEventListener(
  "pointerdown",
  e => {
    lastX = e.clientX;
    lastY = e.clientY;
  }
);
renderer.domElement.addEventListener(
  "pointermove",
  e => {
    if(lastX === null) return;
    rotationY +=
      (e.clientX-lastX) * .01;
    rotationX +=
      (e.clientY-lastY) * .01;
    lastX = e.clientX;
    lastY = e.clientY;
  }
);
renderer.domElement.addEventListener(
  "pointerup",
  () => {
    lastX = null;
    lastY = null;
  }
);
/* =========================
   ANIMATION
========================= */
function animate(){
  requestAnimationFrame(
    animate
  );
  const t =
    performance.now()/1000;
  cube.position.y =
    Math.sin(t*1.5)*.25;
  cube.rotation.x =
    rotationX + t*.25;
  cube.rotation.y =
    rotationY + t*.45;
  material.emissiveIntensity =
    1.5 +
    Math.sin(t*4)*.5;
  renderer.render(
    scene,
    camera
  );
}
animate();
/* =========================
   RESIZE
========================= */
window.onresize = () => {
  camera.aspect =
    innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(
    innerWidth,
    innerHeight
  );
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">
<title>AR PANZER // iPhone</title>
<!-- =====================================================
     MODEL-VIEWER
===================================================== -->
<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}
/* =====================================================
   3D MODEL
===================================================== */
model-viewer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    --poster-color: transparent;
}
/* =====================================================
   HUD
===================================================== */
#hud {
    position: fixed;
    left: 14px;
    right: 14px;
    top: calc(
        10px +
        env(safe-area-inset-top)
    );
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
}
.hudBox {
    padding: 8px 10px;
    background:
        rgba(0,0,0,.65);
    border:
        1px solid
        rgba(0,245,255,.55);
    color: #00f5ff;
    font-size: 11px;
    letter-spacing: 2px;
}
/* =====================================================
   INFO
===================================================== */
#info {
    position: fixed;
    left: 15px;
    right: 15px;
    bottom: calc(
        90px +
        env(safe-area-inset-bottom)
    );
    z-index: 20;
    padding: 14px;
    background:
        rgba(0,0,0,.75);
    border:
        1px solid
        rgba(0,245,255,.45);
    color: #aaa;
    text-align: center;
    font-size: 12px;
    line-height: 1.5;
}
/* =====================================================
   AR BUTTON
===================================================== */
#ar-button {
    position: fixed;
    left: 50%;
    bottom: calc(
        22px +
        env(safe-area-inset-bottom)
    );
    transform:
        translateX(-50%);
    z-index: 30;
    pointer-events: auto;
    padding: 16px 25px;
    border:
        1px solid
        #00f5ff;
    border-radius: 5px;
    background:
        #00f5ff;
    color: #000;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
}
/* =====================================================
   AR AKTIV
===================================================== */
model-viewer[ar-status="session-started"]
~ #info {
    display: none;
}
/* =====================================================
   START SCREEN
===================================================== */
#startScreen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 30px;
    text-align: center;
    background:
        radial-gradient(
            circle at center,
            rgba(0,245,255,.12),
            rgba(0,0,0,.96)
        );
    color: white;
}
#startScreen h1 {
    margin: 0;
    color: #00f5ff;
    font-size: 29px;
    letter-spacing: 5px;
}
#startScreen p {
    max-width: 330px;
    margin: 0;
    color: #aaa;
    line-height: 1.5;
}
#startButton {
    padding: 16px 25px;
    border:
        1px solid
        #00f5ff;
    background:
        #00f5ff;
    color: #000;
    border-radius: 5px;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
}
</style>
</head>
<body>
<!-- =====================================================
     ECHTES 3D-OBJEKT
===================================================== -->
<model-viewer
    id="tank"
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    alt="3D Panzer Testmodell"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    exposure="1"
    scale="0.5 0.5 0.5"
    camera-orbit="0deg 75deg 3m">
    <!-- AR BUTTON -->
    <button
        id="ar-button"
        slot="ar-button">
        3D-OBJEKT IN AR
    </button>
</model-viewer>
<!-- =====================================================
     HUD
===================================================== -->
<div id="hud">
    <div class="hudBox">
        AR // TANK
    </div>
    <div
        class="hudBox"
        id="status">
        3D // LOADING
    </div>
</div>
<!-- =====================================================
     INFO
===================================================== -->
<div id="info">
    Lade echtes 3D-Modell ...
</div>
<!-- =====================================================
     START SCREEN
===================================================== -->
<div id="startScreen">
    <h1>
        AR // TANK
    </h1>
    <p>
        Dieser Test lädt ein echtes
        3D-Modell.
        <br><br>
        Danach kannst du versuchen,
        es räumlich in deiner Umgebung
        zu platzieren.
    </p>
    <button id="startButton">
        3D-AR TESTEN
    </button>
</div>
<script>
/* =====================================================
   ELEMENTE
===================================================== */
const tank =
    document.getElementById("tank");
const startScreen =
    document.getElementById("startScreen");
const startButton =
    document.getElementById("startButton");
const status =
    document.getElementById("status");
const info =
    document.getElementById("info");
/* =====================================================
   3D GELADEN
===================================================== */
tank.addEventListener(
    "load",
    () => {
        status.textContent =
            "3D // ONLINE";
        info.innerHTML =
            "ECHTES 3D-MODELL GELADEN<br><br>" +
            "Tippe auf <b>3D-OBJEKT IN AR</b>.";
    }
);
/* =====================================================
   FEHLER
===================================================== */
tank.addEventListener(
    "error",
    () => {
        status.textContent =
            "3D // ERROR";
        info.innerHTML =
            "Das 3D-Modell konnte nicht geladen werden.";
    }
);
/* =====================================================
   START
===================================================== */
startButton.addEventListener(
    "click",
    () => {
        startScreen.style.display =
            "none";
        info.innerHTML =
            "3D // BEREIT<br><br>" +
            "Tippe unten auf " +
            "<b>3D-OBJEKT IN AR</b>.";
    }
);
/* =====================================================
   AR STATUS
===================================================== */
tank.addEventListener(
    "ar-status",
    event => {
        const state =
            event.detail.status;
        console.log(
            "AR:",
            state
        );
        if(
            state ===
            "session-started"
        ) {
            status.textContent =
                "AR // ACTIVE";
            info.style.display =
                "none";
        }
        if(
            state ===
            "not-presenting"
        ) {
            status.textContent =
                "3D // ONLINE";
            info.style.display =
                "block";
        }
    }
);
</script>
</body>
</html>

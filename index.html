<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<title>AR PANZER // Tank.glb</title>


<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
</script>


<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;

}


model-viewer {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #080808;

    --poster-color: #080808;

}


#hud {

    position: fixed;

    left: 14px;
    right: 14px;

    top: calc(
        10px +
        env(safe-area-inset-top)
    );

    z-index: 20;

    display: flex;

    justify-content: space-between;

    pointer-events: none;

}


.hudBox {

    padding: 8px 10px;

    background:
        rgba(0,0,0,.70);

    border:
        1px solid
        rgba(0,245,255,.55);

    color: #00f5ff;

    font-size: 11px;

    letter-spacing: 2px;

}


#info {

    position: fixed;

    left: 15px;
    right: 15px;

    bottom: calc(
        105px +
        env(safe-area-inset-bottom)
    );

    z-index: 20;

    padding: 13px;

    background:
        rgba(0,0,0,.78);

    border:
        1px solid
        rgba(0,245,255,.4);

    color: #aaa;

    text-align: center;

    font-size: 11px;

    line-height: 1.5;

}


#animationControls {

    position: fixed;

    left: 50%;

    bottom: calc(
        20px +
        env(safe-area-inset-bottom)
    );

    transform:
        translateX(-50%);

    z-index: 30;

    width: calc(
        100% - 20px
    );

    max-width: 500px;

    display: flex;

    gap: 7px;

    justify-content: center;

    flex-wrap: wrap;

}


.animButton {

    padding: 10px 12px;

    border:
        1px solid
        #00f5ff;

    border-radius: 4px;

    background:
        rgba(0,0,0,.82);

    color: #00f5ff;

    font-size: 10px;

    font-weight: bold;

}


.animButton:active {

    background: #00f5ff;

    color: #000;

}


#arButton {

    background:
        #00f5ff;

    color: #000;

}


#startScreen {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 18px;

    padding: 30px;

    background:
        radial-gradient(
            circle at center,
            rgba(0,245,255,.12),
            rgba(0,0,0,.96)
        );

    color: white;

    text-align: center;

}


#startScreen h1 {

    margin: 0;

    color: #00f5ff;

    font-size: 29px;

    letter-spacing: 5px;

}


#startScreen p {

    max-width: 330px;

    color: #aaa;

    line-height: 1.5;

}


#startButton {

    padding: 16px 25px;

    border:
        1px solid
        #00f5ff;

    background:
        #00f5ff;

    color: #000;

    border-radius: 5px;

    font-size: 15px;

    font-weight: bold;

    letter-spacing: 2px;

}

</style>

</head>


<body>


<!-- =====================================================
     TANK.GL B
===================================================== -->

<model-viewer

    id="tank"

    src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Tank/glTF-Binary/Tank.glb"

    alt="3D Panzermodell"

    ar

    ar-modes="
        webxr
        scene-viewer
        quick-look
    "

    camera-controls

    touch-action="pan-y"

    shadow-intensity="1"

    exposure="1"

    camera-orbit="
        0deg
        70deg
        4m
    "

    min-camera-orbit="
        auto
        auto
        1m
    "

    max-camera-orbit="
        auto
        auto
        10m
    ">


    <button
        id="arButton"
        slot="ar-button">

        PANZER IN AR STARTEN

    </button>


</model-viewer>


<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

    <div class="hudBox">

        AR // TANK

    </div>


    <div
        class="hudBox"
        id="status">

        3D // LOADING

    </div>

</div>


<!-- =====================================================
     INFO
===================================================== -->

<div id="info">

    Lade Tank.glb ...

</div>


<!-- =====================================================
     ANIMATION CONTROLS
===================================================== -->

<div id="animationControls"></div>


<!-- =====================================================
     START
===================================================== -->

<div id="startScreen">

    <h1>

        AR // TANK

    </h1>


    <p>

        Echtes 3D-Panzermodell.

        <br><br>

        Zuerst prüfen wir,
        welche Animationen
        tatsächlich im Modell
        vorhanden sind.

    </p>


    <button id="startButton">

        PANZER TESTEN

    </button>

</div>


<script>


/* =====================================================
   ELEMENTE
===================================================== */

const tank =
    document.getElementById(
        "tank"
    );


const status =
    document.getElementById(
        "status"
    );


const info =
    document.getElementById(
        "info"
    );


const startScreen =
    document.getElementById(
        "startScreen"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const controls =
    document.getElementById(
        "animationControls"
    );


/* =====================================================
   MODELL GELADEN
===================================================== */

tank.addEventListener(
    "load",
    () => {

        status.textContent =
            "3D // ONLINE";


        const animations =
            tank.availableAnimations;


        console.log(
            "Tank Animationen:",
            animations
        );


        /*
        ================================================
        KEINE ANIMATIONEN
        ================================================
        */

        if(
            !animations ||
            animations.length === 0
        ) {

            info.innerHTML =
                "TANK.GL BEREIT<br><br>" +
                "<b>Keine eingebetteten Animationen gefunden.</b><br>" +
                "Das Modell kann trotzdem aus einzelnen " +
                "3D-Teilen bestehen.";

            return;

        }


        /*
        ================================================
        ANIMATIONEN GEFUNDEN
        ================================================
        */

        info.innerHTML =
            "TANK.GL BEREIT<br><br>" +
            "Animationen gefunden: " +
            "<b>" +
            animations.length +
            "</b>";


        animations.forEach(
            animationName => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "animButton";


                button.textContent =
                    animationName;


                button.addEventListener(
                    "click",
                    () => {

                        playAnimation(
                            animationName
                        );

                    }
                );


                controls.appendChild(
                    button
                );

            }
        );

    }
);


/* =====================================================
   ANIMATION ABSPIELEN
===================================================== */

function playAnimation(
    animationName
) {

    console.log(
        "Animation:",
        animationName
    );


    tank.animationName =
        animationName;


    tank.timeScale =
        1;


    tank.play();


    status.textContent =
        "ANIM // " +
        animationName;

}


/* =====================================================
   FEHLER
===================================================== */

tank.addEventListener(
    "error",
    event => {

        console.error(
            event
        );


        status.textContent =
            "3D // ERROR";


        info.innerHTML =
            "Tank.glb konnte nicht geladen werden.";

    }
);


/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    () => {

        startScreen.style.display =
            "none";

    }
);


/* =====================================================
   AR STATUS
===================================================== */

tank.addEventListener(
    "ar-status",
    event => {

        const state =
            event.detail.status;


        console.log(
            "AR STATUS:",
            state
        );


        if(
            state ===
            "session-started"
        ) {

            status.textContent =
                "AR // ACTIVE";

        }


        if(
            state ===
            "not-presenting"
        ) {

            status.textContent =
                "3D // ONLINE";

        }


        if(
            state ===
            "failed"
        ) {

            status.textContent =
                "AR // FAILED";


            info.innerHTML =
                "AR konnte nicht gestartet werden.";

        }

    }
);

</script>

</body>

</html>

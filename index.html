<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BRUCHWIESEN · GBA MAP RENDER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0f380f;color:#9bbc0f;font-family:'Share Tech Mono',monospace;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100%;height:100dvh}
  .top{height:44px;background:#0a1f0a;border-bottom:3px solid #306230;display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:8px}
  .logo{font-size:12px;font-weight:bold;letter-spacing:1px;color:#9bbc0f}
  .btn{height:28px;padding:0 10px;border:2px solid #306230;background:#0f380f;color:#9bbc0f;font-size:11px;font-family:inherit;cursor:pointer;text-transform:uppercase}
  .btn.ok{border-color:#9bbc0f}
  .btn:disabled{opacity:.4}
  .main{flex:1;display:flex;min-height:0}
  .side{width:200px;background:#0a1f0a;border-right:3px solid #306230;padding:10px;overflow:auto;font-size:11px;line-height:1.4}
  .game-wrap{flex:1;position:relative;background:#9bbc0f;min-width:0}
  #game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  .status{height:24px;background:#0a1f0a;border-top:3px solid #306230;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-size:10px}
  input[type=file]{display:none}
  .pad{display:grid;grid-template-columns:repeat(3,40px);gap:3px;margin-top:8px}
  .pad button{height:40px;border:2px solid #306230;background:#0f380f;color:#9bbc0f;font-size:14px;cursor:pointer}
  .pad .e{visibility:hidden}
  b{color:#c4d6a0}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">BRUCHWIESEN · GBA-ZIELGRAFIK</div>
    <div style="display:flex;gap:6px">
      <button class="btn" id="btnLoad">WELT</button>
      <button class="btn" id="btnSprite">SPRITE</button>
      <button class="btn ok" id="btnPlay" disabled>PLAY</button>
    </div>
  </div>
  <div class="main">
    <div class="side">
      <div>Zielgrafik = Pokémon/GBA-Aufsicht<br>aus <b>echten</b> Satelliten-Geometrien.</div>
      <div style="margin-top:10px" id="info">Keine Welt</div>
      <div class="pad">
        <div class="e"></div><button data-dir="up">▲</button><div class="e"></div>
        <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
      </div>
      <div style="margin-top:10px;opacity:.8;font-size:10px">WASD · Editor-Look ist egal · nur fertige Map-Optik</div>
    </div>
    <div class="game-wrap"><canvas id="game"></canvas></div>
  </div>
  <div class="status"><span id="status">BW_WORLD laden</span><span id="pos">—</span></div>
</div>
<input type="file" id="fileWorld" accept=".json,application/json">
<input type="file" id="fileSprite" accept="image/*">

<script>
(function(){
"use strict";
// Classic Game Boy / Pokémon Crystal-ish 4-green + accents
const P = {
  light:  "#e0f8d0",
  mid:    "#88c070",
  dark:   "#346856",
  black:  "#081820",
  path:   "#c8d8a0",
  pathD:  "#a0b878",
  street: "#5a7850",
  roof:   "#2a4838",
  wall:   "#4a6850",
  wallL:  "#6a8870",
  tennis: "#c8a848",
  tennisD:"#a08830",
  tree:   "#1a4030",
  treeL:  "#2a6040",
  water:  "#4a7868",
  court:  "#d0c060"
};

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let world=null, playing=false;
let player={x:4000,y:3600,r:90,facing:1};
let keys={}, touch={x:0,y:0};
let view={scale:1,cx:0,cy:0,user:false};
let coll=[];
let lastT=0, SPEED=360;
let sprite=new Image();
sprite.src="player_scooter.jpeg";
sprite.onload=()=>draw();

function resize(){
  const wrap=canvas.parentElement;
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=wrap.clientWidth*dpr; canvas.height=wrap.clientHeight*dpr;
  canvas.style.width=wrap.clientWidth+"px"; canvas.style.height=wrap.clientHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0); draw();
}
function status(t){document.getElementById("status").textContent=t;}
function pip(x,y,pts){
  let ins=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/((yj-yi)||1e-12)+xi)) ins=!ins;
  }
  return ins;
}
function blocked(x,y){
  if(!world) return true;
  const b=world.world.bounds;
  if(x<b.x||y<b.y||x>b.x+b.w||y>b.y+b.h) return true;
  for(const p of coll) if(pip(x,y,p)) return true;
  return false;
}
function rebuildColl(){
  coll=[];
  const mats=world.materials||{};
  (world.features||[]).forEach(f=>{
    const g=f.geometry; if(!g||g.kind!=="polygon"||!g.points||g.points.length<3) return;
    const mat=mats[f.material]||{}, props=f.properties||{};
    let c=props.collision;
    if(c===undefined) c = mat.walkable===false || ["building","vegetation","object","fence"].includes(f.type);
    if(c) coll.push(g.points);
  });
}
function loadWorld(data){
  if(!data?.features||!data?.world) throw new Error("Ungültige Welt");
  world=data; rebuildColl();
  if(data.playerStart){player.x=data.playerStart.x; player.y=data.playerStart.y;}
  else {const b=data.world.bounds; player.x=b.x+b.w/2; player.y=b.y+b.h/2;}
  view.cx=player.x; view.cy=player.y; view.user=false;
  document.getElementById("btnPlay").disabled=false;
  document.getElementById("info").innerHTML=
    "<b>"+(data.meta?.name||"Bruchwiesen")+"</b><br>"+data.features.length+" Objekte<br>"+coll.length+" Kollisionen";
  status("GBA-Map bereit – PLAY");
  draw();
}

function W2S(wx,wy,w,h){ const s=view.scale; return [w/2+(wx-view.cx)*s, h/2+(wy-view.cy)*s]; }

// --- Pixel-art helpers (chunky, no anti-alias) ---
function pxFillPoly(pts, fill, stroke){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0)ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); });
  ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.stroke(); }
}
function pxLine(pts, color, width){
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0)ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); });
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap="square"; ctx.lineJoin="miter"; ctx.stroke();
}

// Draw a simple GBA building from bbox of polygon
function drawBuildingGBA(screenPts){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  screenPts.forEach(p=>{minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);});
  const bw=maxX-minX, bh=maxY-minY;
  if(bw<4||bh<4) return;
  // footprint
  pxFillPoly(screenPts, P.wall, P.black);
  // roof slab (upper 55%)
  const roofH = bh*0.45;
  ctx.fillStyle=P.roof;
  ctx.fillRect(Math.floor(minX), Math.floor(minY), Math.ceil(bw), Math.ceil(roofH));
  // roof edge
  ctx.fillStyle=P.black;
  ctx.fillRect(Math.floor(minX), Math.floor(minY+roofH-1), Math.ceil(bw), 2);
  // windows strip
  const wy=minY+roofH+bh*0.15;
  const ww=Math.max(3, bw*0.12), gap=ww*1.8;
  ctx.fillStyle=P.light;
  for(let x=minX+bw*0.15; x<maxX-bw*0.15; x+=gap){
    ctx.fillRect(Math.floor(x), Math.floor(wy), Math.ceil(ww), Math.ceil(bh*0.12));
  }
  // door
  const dw=Math.max(4,bw*0.14), dh=Math.max(6,bh*0.22);
  ctx.fillStyle=P.dark;
  ctx.fillRect(Math.floor(minX+bw/2-dw/2), Math.floor(maxY-dh-1), Math.ceil(dw), Math.ceil(dh));
}

function drawTreeCluster(screenPts){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  screenPts.forEach(p=>{minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);});
  // base blob
  pxFillPoly(screenPts, P.tree, P.black);
  // lighter blobs for canopy depth
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const rx=(maxX-minX)*0.25, ry=(maxY-minY)*0.25;
  ctx.fillStyle=P.treeL;
  for(const [ox,oy] of [[-0.3,-0.2],[0.25,-0.15],[0,0.2]]){
    ctx.beginPath();
    ctx.ellipse(cx+ox*(maxX-minX), cy+oy*(maxY-minY), rx, ry, 0, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawTennis(screenPts){
  pxFillPoly(screenPts, P.tennis, P.black);
  // simple center line
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  screenPts.forEach(p=>{minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);});
  ctx.strokeStyle=P.light; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo((minX+maxX)/2, minY+2); ctx.lineTo((minX+maxX)/2, maxY-2);
  ctx.moveTo(minX+2,(minY+maxY)/2); ctx.lineTo(maxX-2,(minY+maxY)/2);
  ctx.stroke();
}

function draw(){
  const wrap=canvas.parentElement;
  const w=wrap.clientWidth, h=wrap.clientHeight;
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,w,h);
  // base meadow
  ctx.fillStyle=P.mid;
  ctx.fillRect(0,0,w,h);
  // subtle dither checker for grass texture
  ctx.fillStyle=P.dark;
  const step=6;
  for(let y=0;y<h;y+=step) for(let x=0;x<w;x+=step){
    if(((x+y)/step)&1) ctx.fillRect(x,y,1,1);
  }

  if(!world){
    ctx.fillStyle=P.black; ctx.font="13px monospace"; ctx.textAlign="center";
    ctx.fillText("BW_WORLD.json → GBA-Zielgrafik", w/2, h/2-40);
    if(sprite.complete&&sprite.naturalWidth){
      const sh=100, sw=sh*(sprite.naturalWidth/sprite.naturalHeight);
      ctx.drawImage(sprite, w/2-sw/2, h/2, sw, sh);
    }
    return;
  }

  const bounds=world.world.bounds;
  if(!view.user) view.scale=Math.min(w/bounds.w,h/bounds.h)*4.0;

  const order={terrain:0,field:0,meadow:0,sport:1,path:2,street:2,vegetation:3,building:4,object:5,fence:4};
  const feats=(world.features||[]).slice().sort((a,b)=>(order[a.type]||5)-(order[b.type]||5));

  feats.forEach(f=>{
    if(f.type==="player") return;
    const g=f.geometry; if(!g?.points?.length) return;
    const sp=g.points.map(p=>W2S(p[0],p[1],w,h));

    if(g.kind==="polygon"){
      if(f.type==="building" || f.material==="building" || (f.material||"").startsWith("roof")){
        drawBuildingGBA(sp);
      } else if(f.type==="vegetation" || f.material==="trees" || f.material==="hedge"){
        drawTreeCluster(sp);
      } else if(f.type==="sport" || f.material==="tennis"){
        drawTennis(sp);
      } else if(f.material==="paved" || f.type==="path" && g.kind==="polygon"){
        pxFillPoly(sp, P.path, P.pathD);
      } else if(f.material==="street"){
        pxFillPoly(sp, P.street, P.black);
      } else if(f.material==="field"||f.material==="meadow"){
        pxFillPoly(sp, P.mid, null);
        // crop lines
        let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
        sp.forEach(p=>{minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);});
        ctx.strokeStyle=P.dark; ctx.lineWidth=1;
        for(let y=minY+8;y<maxY;y+=10){ ctx.beginPath(); ctx.moveTo(minX,y); ctx.lineTo(maxX,y); ctx.stroke(); }
      } else {
        // terrain / generic
        pxFillPoly(sp, f.material==="grass"?P.mid:P.dark, null);
      }
    } else if(g.kind==="linestring"){
      const lw=Math.max(3, (g.width||100)*view.scale);
      const isStreet=f.type==="street"||f.material==="street";
      pxLine(sp, isStreet?P.street:P.path, lw);
      if(isStreet){
        ctx.setLineDash([6,6]);
        pxLine(sp, P.path, 1);
        ctx.setLineDash([]);
      }
    } else if(g.kind==="point"){
      // single tree
      const [sx,sy]=sp[0];
      const r=Math.max(6,(g.radius||50)*view.scale*0.2);
      ctx.fillStyle=P.tree;
      ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=P.treeL;
      ctx.beginPath(); ctx.arc(sx-r*0.2,sy-r*0.2,r*0.45,0,Math.PI*2); ctx.fill();
    }
  });

  // Player sprite TZ
  const [px,py]=W2S(player.x,player.y,w,h);
  const sprH=Math.max(32, player.r*view.scale*0.9);
  const sprW=sprite.naturalWidth? sprH*(sprite.naturalWidth/sprite.naturalHeight):sprH;
  ctx.fillStyle="rgba(8,24,32,0.3)";
  ctx.beginPath(); ctx.ellipse(px, py+sprH*0.2, sprW*0.3, sprH*0.1, 0,0,Math.PI*2); ctx.fill();
  ctx.save();
  ctx.translate(px,py);
  if(player.facing<0) ctx.scale(-1,1);
  if(sprite.complete&&sprite.naturalWidth)
    ctx.drawImage(sprite, -sprW/2, -sprH*0.78, sprW, sprH);
  else {
    ctx.fillStyle=P.dark; ctx.fillRect(-10,-16,20,24);
  }
  ctx.restore();
}

function tick(t){
  if(!lastT) lastT=t;
  const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
  if(playing&&world){
    let dx=0,dy=0;
    if(keys.w||keys.arrowup) dy--; if(keys.s||keys.arrowdown) dy++;
    if(keys.a||keys.arrowleft) dx--; if(keys.d||keys.arrowright) dx++;
    dx+=touch.x; dy+=touch.y;
    if(dx||dy){
      const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
      if(dx) player.facing=dx<0?-1:1;
      const sp=SPEED*dt;
      if(!blocked(player.x+dx*sp, player.y)) player.x+=dx*sp;
      if(!blocked(player.x, player.y+dy*sp)) player.y+=dy*sp;
    }
    view.cx+=(player.x-view.cx)*Math.min(1,dt*6);
    view.cy+=(player.y-view.cy)*Math.min(1,dt*6);
    document.getElementById("pos").textContent=Math.round(player.x)+", "+Math.round(player.y);
  }
  draw();
  requestAnimationFrame(tick);
}

window.addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;});
window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});
document.querySelectorAll(".pad button").forEach(btn=>{
  const d=btn.dataset.dir;
  btn.onpointerdown=e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);
    if(d==="up")touch.y=-1; if(d==="down")touch.y=1; if(d==="left")touch.x=-1; if(d==="right")touch.x=1;};
  btn.onpointerup=()=>{touch.x=0;touch.y=0;};
});
document.getElementById("btnLoad").onclick=()=>document.getElementById("fileWorld").click();
document.getElementById("fileWorld").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{loadWorld(JSON.parse(r.result));}catch(err){status(err.message);}};
  r.readAsText(f);
};
document.getElementById("btnSprite").onclick=()=>document.getElementById("fileSprite").click();
document.getElementById("fileSprite").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const url=URL.createObjectURL(f);
  sprite=new Image(); sprite.onload=()=>draw(); sprite.src=url;
};
document.getElementById("btnPlay").onclick=()=>{if(!world)return; playing=true; status("PLAY");};
canvas.addEventListener("wheel",e=>{
  e.preventDefault(); view.user=true;
  view.scale*=e.deltaY<0?1.1:0.9;
  view.scale=Math.max(0.02,Math.min(2,view.scale));
},{passive:false});
window.addEventListener("resize",resize);
resize(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>

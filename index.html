<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BRUCHWIESEN DETAIL EXTRACTOR 2.2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap');
  :root{--bg:#0a0c12;--panel:#10141e;--cyan:#00e5ff;--green:#00ff9d;--magenta:#ff2d78;--yellow:#ffc107;--red:#ff3b5c;--text:#e8f0ff;--dim:#5a6a80;--border:#1c2535}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100%;height:100dvh}
  .top{height:48px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0}
  .logo{font-family:Orbitron,sans-serif;font-size:13px;font-weight:800;letter-spacing:1px;color:var(--cyan)}
  .top-actions{display:flex;gap:6px;flex-wrap:wrap}
  .btn{height:30px;padding:0 10px;border-radius:5px;border:1px solid #1e3a5f;background:#0f1c2e;color:var(--cyan);font-size:10px;font-family:inherit;text-transform:uppercase;cursor:pointer;white-space:nowrap}
  .btn:active{opacity:.7}.btn.ok{border-color:var(--green);color:var(--green)}.btn.warn{border-color:var(--yellow);color:var(--yellow)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .main{flex:1;display:flex;overflow:hidden}
  .side{width:270px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
  .side-r{width:290px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
  .center{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#07090f}
  .sec{padding:10px 12px;border-bottom:1px solid var(--border)}
  .sec-title{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  .scroll{flex:1;overflow:auto}
  .status-bar{height:26px;background:#080c14;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:10px;color:var(--dim);flex-shrink:0}
  input,select,textarea{width:100%;background:#080c14;border:1px solid #1a2a40;border-radius:5px;color:var(--text);padding:7px 9px;font-size:11px;font-family:inherit}
  textarea{min-height:90px;resize:vertical}
  label{font-size:9px;color:var(--dim);display:block;margin:6px 0 3px}
  .row{display:flex;gap:6px}.row>*{flex:1}
  .stage{padding:7px 10px;border-bottom:1px solid #1a2230;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:8px}
  .stage:hover,.stage.sel{background:#0c1a28}
  .stage .num{color:var(--cyan);font-size:10px;min-width:22px}.stage.done .num{color:var(--green)}
  .stage .lab{flex:1}.stage .cnt{color:var(--dim);font-size:9px}
  .feat{padding:6px 10px;border-bottom:1px solid #1a2230;font-size:10px;cursor:pointer}
  .feat:hover,.feat.sel{background:#0c1a28}.feat .n{color:var(--text)}.feat .t{color:var(--dim);font-size:9px}
  .img-card{padding:8px;border:1px solid #1a2a40;border-radius:6px;margin-bottom:8px;font-size:10px}
  .img-card .id{color:var(--cyan);font-weight:bold}
  .okmsg{color:var(--green);font-size:10px}.err{color:var(--red);font-size:10px}
  .hint{font-size:9px;color:var(--dim);line-height:1.35;margin-top:4px}
  .prompt-box{flex:1;display:flex;flex-direction:column;padding:12px;overflow:hidden}
  .prompt-box textarea{flex:1;min-height:180px;font-size:11px;line-height:1.4}
  .tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
  .tab{padding:5px 10px;border-radius:4px;border:1px solid #1e3a5f;background:#0c1520;color:var(--dim);font-size:10px;cursor:pointer;font-family:inherit}
  .tab.active{border-color:var(--cyan);color:var(--cyan)}
  .panel{display:none;flex:1;overflow:auto;flex-direction:column}.panel.show{display:flex}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal.show{display:flex}

  .modal-head{padding:12px 14px;border-bottom:1px solid var(--border);font-family:Orbitron,sans-serif;font-size:12px;color:var(--cyan)}

<script>
(function(){
"use strict";

const STAGES = [
  {id:"01_zones", label:"Zonen", allow:["geometry","meta"]},
  {id:"02_buildings", label:"Gebäude", allow:["geometry","meta","measures","render"]},
  {id:"03_sports", label:"Sport", allow:["geometry","meta","measures","render"]},
  {id:"04_paths", label:"Wege", allow:["geometry","meta","measures","render"]},
  {id:"05_vegetation", label:"Vegetation", allow:["geometry","meta","measures","render"]},
  {id:"06_objects", label:"Objekte", allow:["geometry","meta","measures","render"]},
  {id:"07_measures", label:"Maße", allow:["measures"]},
  {id:"08_render", label:"Render", allow:["render"]},
  {id:"09_validate", label:"Validierung", allow:[]},
  {id:"10_merge", label:"Merge", allow:["geometry","meta","measures","render"]},
];
const WORLD_W=10000, WORLD_H=10000, SCHEMA="1.0";
const CTRL_TOL=80, FIT_RMSE_MAX=60, COL_MIN=0.025;
const KINDS=new Set(["polygon","linestring","point"]);
const MATERIALS={
  grass:{color:"#3d7a37",walkable:true},meadow:{color:"#4a8f42",walkable:true},field:{color:"#6b9e3a",walkable:true},
  path:{color:"#8a8a8a",walkable:true},street:{color:"#3d3d3d",walkable:true},paved:{color:"#9a9a9a",walkable:true},
  tennis:{color:"#c4783a",walkable:true},building:{color:"#5a5a6e",walkable:false},roof_dark:{color:"#3a3a48",walkable:false},
  roof_red:{color:"#8b3a2a",walkable:false},roof_solar:{color:"#2a2a38",walkable:false},trees:{color:"#1e3d1a",walkable:false},
  hedge:{color:"#2d4a28",walkable:false},fence:{color:"#6a6a6a",walkable:false},parking:{color:"#5a5a5a",walkable:true},
  container:{color:"#4a6a8a",walkable:false}
};

let project=null, currentStage="01_zones", selectedFeat=null, lastErrors=[];

function allow(stage){ const s=STAGES.find(x=>x.id===stage); return new Set(s?s.allow:[]); }

// ----- QR least squares for affine -----
// Solve min ||A x - b|| for A (n×3), using Householder QR
function qrSolve3(A, b) {
  // A: array of rows length 3, b: array length n
  const n = A.length;
  if (n < 3) throw new Error("n<3");
  // copy
  const M = A.map((row,i) => [row[0], row[1], row[2], b[i]]);
  // Householder QR on first 3 columns
  for (let k=0; k<3; k++) {
    let norm = 0;
    for (let i=k; i<n; i++) norm += M[i][k]*M[i][k];
    norm = Math.sqrt(norm);
    if (norm < 1e-14) throw new Error("Rank-Mangel in Spalte "+k);
    const sign = M[k][k] >= 0 ? 1 : -1;
    const u0 = M[k][k] + sign*norm;
    const u = [];
    for (let i=k; i<n; i++) u.push(i===k ? u0 : M[i][k]);
    let unorm2 = 0; for (const v of u) unorm2 += v*v;
    // apply reflector to columns k..3
    for (let j=k; j<4; j++) {
      let dot = 0;
      for (let i=0; i<u.length; i++) dot += u[i]*M[k+i][j];
      const scale = 2*dot / unorm2;
      for (let i=0; i<u.length; i++) M[k+i][j] -= scale*u[i];
    }
  }
  // back-sub R (3×3 upper) 
  const x = [0,0,0];
  for (let i=2; i>=0; i--) {
    let s = M[i][3];
    for (let j=i+1; j<3; j++) s -= M[i][j]*x[j];
    if (Math.abs(M[i][i]) < 1e-14) throw new Error("Singulär bei Back-Sub");
    x[i] = s / M[i][i];
  }
  return x;
}

/**
 * Kollinearitäts-Score (verbindlich für Extractor 2.2)
 * ----------------------------------------------------
 * - Nur Pixelkoordinaten der Fit-GCPs (Kontrolle bereits herausgefiltert)
 * - Alle Punkttripel → größte Dreiecksfläche maxArea
 * - score = maxArea / extent²
 * - extent = max(Δx, Δy, 1)
 * - Score < 0.025 → QR-Fit abbrechen
 * - Kontroll-GCPs zählen nicht
 * - Degenerations-/Flächendeckungsindikator, kein vollständiger Stabilitätsnachweis
 */
function collinearityScore(gcps) {
  // erwartet bereits nur Fit-Punkte mit {px, py} (oder {x,y})
  const points = gcps.map(g => ({
    x: g.px != null ? g.px : g.x,
    y: g.py != null ? g.py : g.y
  }));
  if (points.length < 3) return 0;

  let maxArea = 0;
  for (let i = 0; i < points.length - 2; i++) {
    for (let j = i + 1; j < points.length - 1; j++) {
      for (let k = j + 1; k < points.length; k++) {
        const p1 = points[i], p2 = points[j], p3 = points[k];
        const area = 0.5 * Math.abs(
          p1.x * (p2.y - p3.y) +
          p2.x * (p3.y - p1.y) +
          p3.x * (p1.y - p2.y)
        );
        if (area > maxArea) maxArea = area;
      }
    }
  }

  const xs = points.map(p => p.x);
  const ys = points.map(p => p.y);
  const extent = Math.max(
    Math.max(...xs) - Math.min(...xs),
    Math.max(...ys) - Math.min(...ys),
    1
  );
  return maxArea / (extent * extent);
}

function fitAffineQR(gcps) {
  // gcps: nur Fit-GCPs (control bereits ausgeschlossen), Felder px,py,wx,wy
  const n = gcps.length;
  if (n < 3) throw new Error("≥3 Fit-GCPs nötig");

  const col = collinearityScore(gcps);
  if (col < COL_MIN) {
    throw new Error("GCPs fast kollinear: Score " + col.toFixed(4) + " < " + COL_MIN);
  }

  const A = gcps.map(g=>[g.px, g.py, 1]);
  const bx = gcps.map(g=>g.wx);
  const by = gcps.map(g=>g.wy);
  const [a,b,c] = qrSolve3(A, bx);
  const [d,e,f] = qrSolve3(A, by);

  // check finite
  [a,b,c,d,e,f].forEach(v=>{ if (!Number.isFinite(v)) throw new Error("Nicht-endliche Koeffizienten"); });

  let sse=0;
  gcps.forEach(g=>{
    const x=a*g.px+b*g.py+c, y=d*g.px+e*g.py+f;
    sse+=(x-g.wx)**2+(y-g.wy)**2;
  });
  const rmse=Math.sqrt(sse/n);

  // scale sanity: pixel→world should not be absurd
  const scaleApprox = Math.hypot(a,d); // roughly world units per pixel in x-ish
  if (scaleApprox < 0.01 || scaleApprox > 500) throw new Error("Unplausible Skalierung ("+scaleApprox.toFixed(4)+")");

  return {a,b,c,d,e,f, rmse, n_points:n, collinearity:col, method:"qr"};
}

function forward(t,px,py){ return [t.a*px+t.b*py+t.c, t.d*px+t.e*py+t.f]; }
function inverse(t,wx,wy){
  const det=t.a*t.e-t.b*t.d;
  if (Math.abs(det)<1e-12) throw new Error("nicht invertierbar");
  const rx=wx-t.c, ry=wy-t.f;
  return [(t.e*rx-t.b*ry)/det, (-t.d*rx+t.a*ry)/det];
}
function controlResiduals(im){
  if (!im.transform) return [];
  return project.gcps.filter(g=>g.image_id===im.id && g.control).map(g=>{
    const [wx,wy]=forward(im.transform,g.pixel_x,g.pixel_y);
    const dx=wx-g.world_x, dy=wy-g.world_y;
    return {id:g.id, err:Math.hypot(dx,dy)};
  });
}

// ----- Strict merge: history OUTSIDE data -----
function strictMerge(rec, incoming, stage) {
  const al = allow(stage);
  const data = rec ? JSON.parse(JSON.stringify(rec.data)) : {};
  data.id = (rec && rec.data.id) || incoming.id;
  if (!data.id) return null;

  if (al.has("meta")) {
    ["type","material","name"].forEach(k=>{ if (incoming[k]!=null && incoming[k]!=="") data[k]=incoming[k]; });
  }
  if (al.has("geometry") && incoming.geometry && typeof incoming.geometry==="object" && !Array.isArray(incoming.geometry)) {
    data.geometry = JSON.parse(JSON.stringify(incoming.geometry));
  }
  if (al.has("measures") && incoming.measures && typeof incoming.measures==="object") {
    data.measures = Object.assign({}, data.measures||{}, incoming.measures);
  }
  if (al.has("render") && incoming.render && typeof incoming.render==="object") {
    data.render = Object.assign({}, data.render||{}, incoming.render);
  }
  // properties from LLM only if meta allowed (geometry stages) – never invent source_stage inside data
  if (al.has("meta") && incoming.properties && typeof incoming.properties==="object") {
    const clean = Object.assign({}, incoming.properties);
    delete clean.source_stage;
    delete clean.updated_stages;
    data.properties = Object.assign({}, data.properties||{}, clean);
  }

  // history on record, not in feature content
  const history = (rec && rec.history) ? rec.history.slice() : [];
  history.push({stage, ts:new Date().toISOString()});

  return { id:data.id, data, history };
}

function upsertFeatures(stage, list) {
  const al = allow(stage);
  if (al.size===0 && stage!=="10_merge") return {n:0, warnings:["Stufe erlaubt keine Schreibfelder"]};
  const seen=new Set(), warnings=[];
  let n=0;
  list.forEach(f=>{
    if (!f||!f.id){ warnings.push("ohne id übersprungen"); return; }
    if (seen.has(f.id)){ warnings.push("doppelte id in Antwort: "+f.id); return; }
    seen.add(f.id);
    if (project.features[f.id]) {
      const merged = strictMerge(project.features[f.id], f, stage);
      if (merged) { project.features[f.id]=merged; n++; }
    } else {
      if (!al.has("geometry") && stage!=="10_merge") {
        warnings.push("neue id '"+f.id+"' ohne Geometrie-Recht ignoriert");
        return;
      }
      const merged = strictMerge(null, f, stage);
      if (merged) { project.features[f.id]=merged; n++; }
    }
  });
  return {n, warnings};
}

// ----- Validator 2.2 -----
function validate() {
  const errors=[];
  if (!project) return ["Kein Projekt"];

  // images / GCPs / transforms
  project.images.forEach(im=>{
    if (!Number.isFinite(im.north)||!Number.isFinite(im.south)||!Number.isFinite(im.west)||!Number.isFinite(im.east))
      errors.push("Bild "+im.id+": Bounds nicht endlich");
    if (im.north<=im.south) errors.push("Bild "+im.id+": north<=south");
    if (im.east<=im.west) errors.push("Bild "+im.id+": east<=west");
    if (im.pixel_width!=null && (!Number.isFinite(im.pixel_width)||im.pixel_width<=0))
      errors.push("Bild "+im.id+": pixel_width ungültig");
    if (im.pixel_height!=null && (!Number.isFinite(im.pixel_height)||im.pixel_height<=0))
      errors.push("Bild "+im.id+": pixel_height ungültig");

    if (im.transform) {
      const t=im.transform;
      [t.a,t.b,t.c,t.d,t.e,t.f].forEach((v,i)=>{
        if (!Number.isFinite(v)) errors.push("Transform "+im.id+": Koeff["+i+"] nicht endlich");
      });
      if (t.rmse>FIT_RMSE_MAX) errors.push("Transform "+im.id+": Fit-RMSE zu hoch ("+t.rmse.toFixed(1)+")");
      if (t.collinearity!=null && t.collinearity<COL_MIN) errors.push("Transform "+im.id+": kollinear");
      const ctrls=controlResiduals(im);
      if (ctrls.length===0)
        errors.push("Transform "+im.id+": keine unabhängigen Kontrollpunkte – Kalibrierung nicht freigabefähig");
      else {
        const sse=ctrls.reduce((s,r)=>s+r.err*r.err,0);
        const crmse=Math.sqrt(sse/ctrls.length);
        if (crmse>CTRL_TOL) errors.push("Transform "+im.id+": Kontroll-RMSE "+crmse.toFixed(1)+" > "+CTRL_TOL);
        ctrls.forEach(r=>{ if (r.err>CTRL_TOL*1.5) errors.push("Kontrollpunkt "+r.id+" Fehler "+r.err.toFixed(1)); });
      }
    }
  });

  project.gcps.forEach(g=>{
    if (!project.images.some(i=>i.id===g.image_id)) errors.push("GCP "+g.id+": Bild "+g.image_id+" fehlt");
    ["world_x","world_y","pixel_x","pixel_y"].forEach(k=>{
      if (!Number.isFinite(g[k])) errors.push("GCP "+g.id+": "+k+" nicht endlich");
    });
    const im=project.images.find(i=>i.id===g.image_id);
    if (im && im.pixel_width!=null && (g.pixel_x<0||g.pixel_x>im.pixel_width))
      errors.push("GCP "+g.id+": pixel_x außerhalb Bildbreite");
    if (im && im.pixel_height!=null && (g.pixel_y<0||g.pixel_y>im.pixel_height))
      errors.push("GCP "+g.id+": pixel_y außerhalb Bildhöhe");
  });

  // features
  const ids=new Set();
  Object.values(project.features).forEach(rec=>{
    const f=rec.data, fid=f.id||"?";
    if (ids.has(fid)) errors.push("Doppelte ID "+fid);
    ids.add(fid);
    if (!f.type || typeof f.type!=="string") errors.push("["+fid+"] type fehlt/ungültig");
    if (f.material!=null && typeof f.material!=="string") errors.push("["+fid+"] material kein String");

    const g=f.geometry;
    if (g==null) { errors.push("["+fid+"] keine geometry"); return; }
    if (typeof g!=="object"||Array.isArray(g)) { errors.push("["+fid+"] geometry kein Objekt"); return; }
    if (!KINDS.has(g.kind)) errors.push("["+fid+"] kind ungültig");
    if (!Array.isArray(g.points)||!g.points.length) { errors.push("["+fid+"] points fehlen"); return; }
    if (g.kind==="polygon"&&g.points.length<3) errors.push("["+fid+"] polygon <3");
    if (g.kind==="linestring"&&g.points.length<2) errors.push("["+fid+"] linestring <2");
    if (g.kind==="point"&&g.points.length!==1) errors.push("["+fid+"] point ≠1 Punkt");

    // degenerate polygon: all points equal
    if (g.kind==="polygon") {
      const p0=g.points[0];
      if (g.points.every(p=>p[0]===p0[0]&&p[1]===p0[1])) errors.push("["+fid+"] polygon degeneriert (alle Punkte gleich)");
    }

    g.points.forEach((p,i)=>{
      if (!Array.isArray(p)||p.length<2) { errors.push("["+fid+"] point["+i+"] ungültig"); return; }
      const x=p[0],y=p[1];
      if (typeof x!=="number"||typeof y!=="number"||!Number.isFinite(x)||!Number.isFinite(y))
        errors.push("["+fid+"] point["+i+"] nicht endlich");
      else if (x<0||x>WORLD_W||y<0||y>WORLD_H) errors.push("["+fid+"] point["+i+"] außerhalb Grid");
    });

    if (f.measures!=null) {
      if (typeof f.measures!=="object"||Array.isArray(f.measures)) errors.push("["+fid+"] measures kein Objekt");
      else ["width_m","length_m","area_m2"].forEach(k=>{
        if (k in f.measures && (typeof f.measures[k]!=="number"||!Number.isFinite(f.measures[k])||f.measures[k]<0))
          errors.push("["+fid+"] measures."+k+" ungültig");
      });
    }
    if (f.render!=null && (typeof f.render!=="object"||Array.isArray(f.render)))
      errors.push("["+fid+"] render kein Objekt");
    if (f.properties!=null && (typeof f.properties!=="object"||Array.isArray(f.properties)))
      errors.push("["+fid+"] properties kein Objekt");
  });

  // player start required for export-quality world
  const hasPlayerFeat = Object.values(project.features).some(r=>{
    const f=r.data;
    return f.id==="player_start"||f.id==="playerStart"||f.type==="player";
  });
  if (!hasPlayerFeat && !project.playerStart)
    errors.push("Spielerstart fehlt (player_start Feature oder project.playerStart)");
  if (project.playerStart) {
    if (!Number.isFinite(project.playerStart.x)||!Number.isFinite(project.playerStart.y))
      errors.push("project.playerStart nicht endlich");
    else if (project.playerStart.x<0||project.playerStart.x>WORLD_W||project.playerStart.y<0||project.playerStart.y>WORLD_H)
      errors.push("project.playerStart außerhalb Grid");
  }

  lastErrors=errors;
  return errors;
}

function transformBlock(){

      "\n    RMSE="+t.rmse.toFixed(2)+" n="+t.n_points+" col="+Number(t.collinearity||0).toFixed(4);

ORT: ${project.name} | ${project.location}

BILDER:
${project.images.map(im=>"- "+im.id+": "+im.filename+" N"+im.north+" S"+im.south+" W"+im.west+" E"+im.east+(im.pixel_width?" "+im.pixel_width+"x"+im.pixel_height:"")).join("\n")}

${stage==="09_validate"? "Report-Objekt: missing, overlapping, suggestions.":""}

Nur JSON.`;

// ----- World -----
function resolvePlayer(){
  for (const rec of Object.values(project.features)) {
    const f=rec.data;
    if (f.id==="player_start"||f.id==="playerStart"||f.type==="player") {
      const pts=f.geometry&&f.geometry.points;
      if (pts&&pts[0]&&Number.isFinite(pts[0][0])&&Number.isFinite(pts[0][1]))
        return {x:pts[0][0], y:pts[0][1]};
    }
  }
  if (project.playerStart && Number.isFinite(project.playerStart.x) && Number.isFinite(project.playerStart.y))
    return {x:project.playerStart.x, y:project.playerStart.y};
  return null; // never invent
}

function worldAspect(){
  // world grid aspect is authoritative for the game world
  return WORLD_W / WORLD_H;
}
function imagePixelAspect(im){
  if (im.pixel_width&&im.pixel_height&&im.pixel_height>0) return im.pixel_width/im.pixel_height;
  return null;
}

function buildWorld(){
  const features=Object.values(project.features).map(r=>JSON.parse(JSON.stringify(r.data)));
  if (!features.some(f=>f.id==="terrain_base")) {
    features.unshift({
      id:"terrain_base",type:"terrain",material:"grass",name:"Grundfläche Gras",
      geometry:{kind:"polygon",points:[[0,0],[WORLD_W,0],[WORLD_W,WORLD_H],[0,WORLD_H]]},
      properties:{collision:false,walkable:true}
    });
  }
  const used=new Set(features.map(f=>f.material).filter(Boolean));
  const materials=JSON.parse(JSON.stringify(MATERIALS));
  used.forEach(m=>{ if(!materials[m]) materials[m]={color:"#888800",walkable:true}; });

  const player=resolvePlayer();
  // imageAspect for renderer: prefer first image pixel aspect, else world
  let imageAspect=worldAspect();
  if (project.images[0]) {
    const pa=imagePixelAspect(project.images[0]);
    if (pa) imageAspect=pa;
  }

  return {
    schemaVersion:SCHEMA,
    editorVersion:"3.2-detail-v2.2",
    meta:{
      name:project.name, location:project.location, coords:project.coords,
      imageAspect:Math.round(imageAspect*10000)/10000,
      worldAspect:Math.round(worldAspect()*10000)/10000,
      createdAt:new Date().toISOString(),
      source:"detail-extractor-v2.2-qr"
    },
    world:{bounds:{x:0,y:0,w:WORLD_W,h:WORLD_H}, layers:["terrain","sports","paths","buildings","vegetation","objects"]},
    materials, features,
    playerStart: player, // may be null – export blocked if null via validator
    collision:{mode:"fromGeometry",gridSize:64}
  };
}

    if (!item.id){ warnings.push("["+idx+"] id fehlt"); return; }
    if (!item.kind || !KINDS.has(item.kind)){ warnings.push("["+item.id+"] kind muss polygon|linestring|point sein"); return; }
    if (!item.type){ warnings.push("["+item.id+"] type fehlt"); return; }
    if (!Array.isArray(item.points)||!item.points.length){ warnings.push("["+item.id+"] points fehlen"); return; }
    if (item.kind==="polygon"&&item.points.length<3){ warnings.push("["+item.id+"] polygon <3"); return; }
    if (item.kind==="linestring"&&item.points.length<2){ warnings.push("["+item.id+"] linestring <2"); return; }
    if (item.kind==="point"&&item.points.length!==1){ warnings.push("["+item.id+"] point ≠1"); return; }
    const pts=item.points.map(([px,py])=>{
      const [wx,wy]=forward(im.transform,px,py);
      return [Math.round(wx*10)/10, Math.round(wy*10)/10];
    });
    converted.push({
      id:item.id, type:item.type, material:item.material||item.type,
      name:item.name||item.id,
      geometry:{kind:item.kind, points:pts, ...(item.width?{width:item.width}:{}), ...(item.radius?{radius:item.radius}:{})},
      properties:{source_image:im.id, from_pixels:true}
    });
  });
  const stage=["02_buildings","03_sports","04_paths","05_vegetation","06_objects"].includes(currentStage)?currentStage:"02_buildings";
  const r=upsertFeatures(stage, converted);
  project.history.push("batch-px "+r.n); persist(); refreshAll();
  document.getElementById("coordOut").textContent=JSON.stringify({converted:r.n, warnings},null,2);
  setStatus("Batch "+r.n+" · Warnungen "+warnings.length);
};
document.getElementById("coordImage").onchange=updateCalibInfo;

function doExport(){
  if (!project) return;
  const errs=validate(); refreshExportGate();
  if (errs.length){ setStatus("Export BLOCKIERT"); document.getElementById("validateOut").textContent=errs.map(e=>"• "+e).join("\n"); return; }
  const world=buildWorld();
  if (!world.playerStart){ setStatus("Export BLOCKIERT: kein playerStart"); return; }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(world,null,2)],{type:"application/json"}));
  a.download="BW_WORLD_v22.json"; a.click();
  setStatus("Export OK · "+world.features.length+" Features");
}
document.getElementById("btnExport").onclick=doExport;
document.getElementById("btnExport2").onclick=doExport;
document.getElementById("btnExportProj").onclick=()=>{
  if (!project) return;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(project,null,2)],{type:"application/json"}));
  a.download="project_v22.json"; a.click();
};
document.getElementById("btnLoadProj").onclick=()=>document.getElementById("fileProj").click();
document.getElementById("fileProj").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ project=JSON.parse(r.result); lastErrors=[]; persist(); refreshAll(); genPrompt(); setStatus("geladen"); }catch(err){ setStatus("Parse-Fehler"); } };
  r.readAsText(f);
};

if (!loadPersisted()) setStatus("EXTRACTOR 2.2 – INIT"); else genPrompt();
})();
</script>

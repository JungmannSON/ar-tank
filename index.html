<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BRUCHWIESEN // LEVEL 001 // MAP CORE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #05070b;
    --panel: #0a0e17;
    --border: #1a2332;
    --cyan: #00f0ff;
    --cyan-dim: #00f0ff88;
    --magenta: #ff00aa;
    --green: #00ff9d;
    --red: #ff3366;
    --text: #e0f2fe;
    --text-dim: #64748b;
    --cell-hover: rgba(0, 240, 255, 0.12);
    --cell-selected: rgba(0, 240, 255, 0.28);
    --cell-labeled: rgba(0, 255, 157, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background-image: 
      radial-gradient(ellipse at 20% 50%, rgba(0, 240, 255, 0.03) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(255, 0, 170, 0.03) 0%, transparent 50%);
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
    pointer-events: none;
    z-index: 9999;
    opacity: 0.35;
  }

  header {
    background: linear-gradient(180deg, #0c1220 0%, #0a0e17 100%);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.06);
    padding: 0 16px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
    position: relative;
  }

  header::before {
    content: "";
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.5;
  }

  .logo { display: flex; align-items: center; gap: 10px; }

  .logo-icon {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--cyan), var(--magenta));
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 900; color: #000;
    font-family: 'Orbitron', sans-serif;
  }

  .logo h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--text));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  .logo span { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; display: block; }

  .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  button {
    background: linear-gradient(180deg, #132033 0%, #0c1525 100%);
    color: var(--cyan);
    border: 1px solid #1e3a5f;
    border-radius: 4px;
    padding: 7px 12px;
    font-size: 11px; font-weight: 500;
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.5px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
  }

  button:hover {
    border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.25);
  }

  button:active { transform: scale(0.97); }

  button.active, button.success {
    background: linear-gradient(180deg, #0a2a2a 0%, #063030 100%);
    border-color: var(--green);
    color: var(--green);
    box-shadow: 0 0 16px rgba(0, 255, 157, 0.2);
  }

  button.danger { border-color: #5f1e2e; color: var(--red); }
  button.danger:hover { border-color: var(--red); box-shadow: 0 0 12px rgba(255, 51, 102, 0.25); }

  .main { flex: 1; display: flex; overflow: hidden; }

  .map-container {
    flex: 1; position: relative; overflow: hidden;
    background: #030508; touch-action: none;
  }

  .map-container::before {
    content: "";
    position: absolute; inset: 0;
    background: 
      linear-gradient(90deg, rgba(0,240,255,0.025) 1px, transparent 1px),
      linear-gradient(rgba(0,240,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 1; opacity: 0.5;
  }

  #mapWrapper {
    position: absolute; transform-origin: 0 0;
    will-change: transform; z-index: 2;
  }

  #satelliteImg {
    display: block; max-width: none;
    user-select: none; pointer-events: none;
    filter: contrast(1.05) saturate(0.92);
  }

  #gridCanvas { position: absolute; top: 0; left: 0; pointer-events: none; }

  .cell-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    pointer-events: auto;
  }

  .cell {
    border: 1px solid rgba(0, 240, 255, 0.07);
    position: relative; cursor: crosshair;
    transition: background 0.1s;
  }

  .cell:hover {
    background: var(--cell-hover);
    border-color: rgba(0, 240, 255, 0.35);
  }

  .cell.selected {
    background: var(--cell-selected);
    border-color: var(--cyan);
    box-shadow: inset 0 0 14px rgba(0, 240, 255, 0.2);
  }

  .cell.labeled { background: var(--cell-labeled); }
  .cell.selected.labeled { background: rgba(0, 240, 255, 0.32); }

  .cell-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 600;
    color: var(--green);
    text-shadow: 0 0 8px rgba(0, 255, 157, 0.7);
    pointer-events: none; text-align: center;
    padding: 1px; overflow: hidden;
    font-family: 'Orbitron', sans-serif; letter-spacing: 0.3px;
  }

  .sidebar {
    width: 340px;
    background: linear-gradient(180deg, #0a0e17 0%, #080c14 100%);
    border-left: 1px solid var(--border);
    box-shadow: -12px 0 40px rgba(0,0,0,0.45);
    display: flex; flex-direction: column;
    overflow: hidden; flex-shrink: 0; position: relative;
  }

  .sidebar::before {
    content: "";
    position: absolute; top: 0; left: 0; bottom: 0; width: 1px;
    background: linear-gradient(180deg, var(--cyan), transparent, var(--magenta));
    opacity: 0.35;
  }

  .sidebar-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-family: 'Orbitron', sans-serif;
    font-weight: 600; font-size: 11px; letter-spacing: 2px;
    color: var(--cyan); text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }

  .sidebar-header::before { content: "▸"; color: var(--magenta); }

  .sidebar-content { flex: 1; overflow-y: auto; padding: 14px; }

  .sidebar-content::-webkit-scrollbar { width: 4px; }
  .sidebar-content::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 2px; }

  .form-group { margin-bottom: 14px; }

  .form-group label {
    display: block; font-size: 10px; color: var(--text-dim);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;
  }

  input[type="text"], textarea, select {
    width: 100%;
    background: #060a12;
    border: 1px solid #1a2a40;
    border-radius: 4px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 13px;
    font-family: 'Share Tech Mono', monospace;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--cyan);
    box-shadow: 0 0 0 2px rgba(0, 240, 255, 0.12);
  }

  textarea { min-height: 64px; resize: vertical; }

  .coord-display {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px; font-weight: 700;
    color: var(--cyan);
    margin-bottom: 16px;
    text-shadow: 0 0 24px rgba(0, 240, 255, 0.45);
    letter-spacing: 1px;
  }

  .area-list { list-style: none; }

  .area-item {
    background: linear-gradient(135deg, #0c1220 0%, #0a0e17 100%);
    border: 1px solid #1a2a40;
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .area-item:hover {
    border-color: var(--cyan);
    box-shadow: 0 0 16px rgba(0, 240, 255, 0.15);
  }

  .area-item .coords {
    font-size: 11px; color: var(--cyan); font-weight: 600;
    font-family: 'Orbitron', sans-serif; letter-spacing: 0.5px;
  }

  .area-item .name { font-weight: 600; margin: 3px 0; font-size: 13px; }

  .area-item .cat {
    font-size: 10px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .status-bar {
    background: #080c14;
    border-top: 1px solid var(--border);
    padding: 6px 16px;
    font-size: 11px; color: var(--text-dim);
    display: flex; justify-content: space-between;
    flex-shrink: 0;
  }

  .status-bar span { display: flex; align-items: center; gap: 6px; }

  .status-dot {
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .empty-state {
    text-align: center; color: var(--text-dim);
    padding: 30px 10px; font-size: 12px; line-height: 1.6;
  }

  .upload-zone {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0a1220 0%, #05070b 70%);
    z-index: 20; gap: 18px; padding: 20px; text-align: center;
  }

  .upload-zone.hidden { display: none; }

  .upload-zone .icon {
    width: 64px; height: 64px;
    border: 2px dashed var(--cyan-dim);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: var(--cyan); margin-bottom: 4px;
  }

  .upload-zone h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 15px; letter-spacing: 3px;
    color: var(--cyan); text-transform: uppercase;
  }

  .upload-zone p { color: var(--text-dim); font-size: 13px; max-width: 280px; line-height: 1.5; }

  #fileInput { display: none; }

  .mode-indicator {
    position: absolute; top: 14px; left: 14px;
    background: rgba(5, 7, 11, 0.88);
    border: 1px solid #1e3a5f;
    color: var(--cyan);
    padding: 6px 14px; border-radius: 4px;
    font-size: 11px; font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px; z-index: 10;
    pointer-events: none; backdrop-filter: blur(8px);
    text-transform: uppercase;
  }

  .section-title {
    font-size: 10px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1.5px;
    margin: 20px 0 10px;
    display: flex; align-items: center; gap: 8px;
  }

  .section-title::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, #1a2a40, transparent);
  }

  @media (max-width: 700px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; height: 40%; border-left: none; border-top: 1px solid var(--border); }
    .logo h1 { font-size: 11px; }
    header { height: 50px; padding: 0 10px; }
    button { padding: 6px 8px; font-size: 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">B</div>
    <div>
      <h1>BRUCHWIESEN</h1>
      <span>LEVEL 001 // MAP CORE</span>
    </div>
  </div>
  <div class="header-actions">
    <button id="btnMulti">MULTI</button>
    <button id="btnExport">EXPORT</button>
    <button id="btnImport">IMPORT</button>
    <button class="danger" id="btnClear">PURGE</button>
  </div>
</header>

<div class="main">
  <div class="map-container" id="mapContainer">
    <div class="upload-zone" id="uploadZone">
      <div class="icon">⬆</div>
      <h2>Satellite Uplink</h2>
      <p>Lade das Satellitenbild der Grundschule in den Bruchwiesen</p>
      <button id="btnLoadImage">BILD LADEN</button>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="mapWrapper">
      <img id="satelliteImg" alt="Satellitenkarte">
      <canvas id="gridCanvas"></canvas>
      <div class="cell-overlay" id="cellOverlay"></div>
    </div>

    <div class="mode-indicator" id="modeIndicator">SINGLE SELECT</div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-header">Sector Editor</div>
    <div class="sidebar-content">
      <div class="empty-state" id="emptyState">
        Tippe auf ein Rasterfeld<br>oder aktiviere MULTI für Bereiche
      </div>

      <div id="editForm" style="display:none;">
        <div class="coord-display" id="coordDisplay">—</div>

        <div class="form-group">
          <label>Bezeichnung</label>
          <input type="text" id="inputName" placeholder="z.B. Bolzplatz">
        </div>

        <div class="form-group">
          <label>Kategorie</label>
          <select id="inputCategory">
            <option value="wiese">Wiese</option>
            <option value="sportflaeche">Sportfläche</option>
            <option value="gebaeude">Gebäude</option>
            <option value="strasse">Straße</option>
            <option value="weg">Weg</option>
            <option value="wald">Wald / Bäume</option>
            <option value="hof">Hof / Asphalt</option>
            <option value="sonstiges">Sonstiges</option>
          </select>
        </div>

        <div class="form-group">
          <label>Beschreibung</label>
          <textarea id="inputDesc" placeholder="Optionale Notizen..."></textarea>
        </div>

        <div style="display:flex; gap:8px; margin-top:4px;">
          <button class="success" id="btnSave" style="flex:1;">SAVE</button>
          <button class="danger" id="btnDelete" style="flex:1;">DELETE</button>
        </div>
      </div>

      <div class="section-title">Captured Sectors</div>
      <ul class="area-list" id="areaList"></ul>
    </div>
  </aside>
</div>

<div class="status-bar">
  <span><span class="status-dot"></span> <span id="statusText">SYSTEM READY</span></span>
  <span id="zoomText">ZOOM 100%</span>
</div>

<script>
(function() {
  const COLS = 10, ROWS = 10;
  const COL_LABELS = "ABCDEFGHIJ".split("");

  let areas = JSON.parse(localStorage.getItem("bruchwiesen_areas") || "[]");
  let selectedCells = new Set();
  let multiMode = false;
  let scale = 1, offsetX = 0, offsetY = 0;
  let isPanning = false, startX, startY;
  let imgNaturalWidth = 0, imgNaturalHeight = 0;

  const mapContainer = document.getElementById("mapContainer");
  const mapWrapper = document.getElementById("mapWrapper");
  const satelliteImg = document.getElementById("satelliteImg");
  const gridCanvas = document.getElementById("gridCanvas");
  const cellOverlay = document.getElementById("cellOverlay");
  const uploadZone = document.getElementById("uploadZone");
  const fileInput = document.getElementById("fileInput");
  const modeIndicator = document.getElementById("modeIndicator");
  const coordDisplay = document.getElementById("coordDisplay");
  const inputName = document.getElementById("inputName");
  const inputCategory = document.getElementById("inputCategory");
  const inputDesc = document.getElementById("inputDesc");
  const editForm = document.getElementById("editForm");
  const emptyState = document.getElementById("emptyState");
  const areaList = document.getElementById("areaList");
  const statusText = document.getElementById("statusText");
  const zoomText = document.getElementById("zoomText");

  document.getElementById("btnLoadImage").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (file) loadImage(URL.createObjectURL(file));
  });

  mapContainer.addEventListener("dragover", e => e.preventDefault());
  mapContainer.addEventListener("drop", e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith("image/")) loadImage(URL.createObjectURL(file));
  });

  function loadImage(src) {
    satelliteImg.onload = () => {
      imgNaturalWidth = satelliteImg.naturalWidth;
      imgNaturalHeight = satelliteImg.naturalHeight;
      satelliteImg.style.width = imgNaturalWidth + "px";
      satelliteImg.style.height = imgNaturalHeight + "px";
      gridCanvas.width = imgNaturalWidth;
      gridCanvas.height = imgNaturalHeight;
      cellOverlay.style.width = imgNaturalWidth + "px";
      cellOverlay.style.height = imgNaturalHeight + "px";
      drawGrid();
      createCells();
      fitToView();
      uploadZone.classList.add("hidden");
      renderAreaList();
      updateCellVisuals();
      setStatus("UPLINK ESTABLISHED");
    };
    satelliteImg.src = src;
  }

  function drawGrid() {
    const ctx = gridCanvas.getContext("2d");
    ctx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
    const cellW = imgNaturalWidth / COLS;
    const cellH = imgNaturalHeight / ROWS;

    ctx.strokeStyle = "rgba(0, 240, 255, 0.22)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
      const x = i * cellW + 0.5;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, imgNaturalHeight); ctx.stroke();
    }
    for (let j = 0; j <= ROWS; j++) {
      const y = j * cellH + 0.5;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(imgNaturalWidth, y); ctx.stroke();
    }

    ctx.fillStyle = "rgba(0, 240, 255, 0.7)";
    ctx.font = "bold 13px Orbitron, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let i = 0; i < COLS; i++) ctx.fillText(COL_LABELS[i], i * cellW + cellW / 2, 14);
    for (let j = 0; j < ROWS; j++) ctx.fillText(String(j + 1), 14, j * cellH + cellH / 2);
  }

  function createCells() {
    cellOverlay.innerHTML = "";
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.coord = COL_LABELS[c] + (r + 1);
        cell.addEventListener("click", e => onCellClick(e, cell));
        cellOverlay.appendChild(cell);
      }
    }
  }

  function onCellClick(e, cell) {
    e.stopPropagation();
    const coord = cell.dataset.coord;
    if (multiMode) {
      selectedCells.has(coord) ? selectedCells.delete(coord) : selectedCells.add(coord);
    } else {
      selectedCells.clear();
      selectedCells.add(coord);
    }
    updateCellVisuals();
    showEditForm();
  }

  function updateCellVisuals() {
    document.querySelectorAll(".cell").forEach(cell => {
      const coord = cell.dataset.coord;
      cell.classList.toggle("selected", selectedCells.has(coord));
      cell.classList.toggle("labeled", areas.some(a => a.cells.includes(coord)));

      let labelEl = cell.querySelector(".cell-label");
      if (!labelEl) {
        labelEl = document.createElement("div");
        labelEl.className = "cell-label";
        cell.appendChild(labelEl);
      }
      const area = areas.find(a => a.cells.length === 1 && a.cells[0] === coord);
      labelEl.textContent = area ? area.name : "";
    });
  }

  function showEditForm() {
    if (selectedCells.size === 0) {
      editForm.style.display = "none";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";
    editForm.style.display = "block";

    const coords = Array.from(selectedCells).sort();
    coordDisplay.textContent = coords.length === 1 ? coords[0] : coords[0] + " → " + coords[coords.length - 1];

    const existing = areas.find(a => a.cells.length === selectedCells.size && a.cells.every(c => selectedCells.has(c)));
    if (existing) {
      inputName.value = existing.name || "";
      inputCategory.value = existing.category || "sonstiges";
      inputDesc.value = existing.description || "";
    } else {
      inputName.value = "";
      inputCategory.value = "wiese";
      inputDesc.value = "";
    }
  }

  document.getElementById("btnSave").addEventListener("click", () => {
    if (selectedCells.size === 0) return;
    const name = inputName.value.trim() || "UNNAMED";
    const cells = Array.from(selectedCells).sort();
    areas = areas.filter(a => !a.cells.some(c => selectedCells.has(c)));
    areas.push({
      id: Date.now().toString(36),
      cells, name,
      category: inputCategory.value,
      description: inputDesc.value.trim(),
      created: new Date().toISOString()
    });
    save();
    updateCellVisuals();
    renderAreaList();
    setStatus("SECTOR SAVED // " + name.toUpperCase());
  });

  document.getElementById("btnDelete").addEventListener("click", () => {
    if (selectedCells.size === 0) return;
    areas = areas.filter(a => !a.cells.some(c => selectedCells.has(c)));
    selectedCells.clear();
    save();
    updateCellVisuals();
    showEditForm();
    renderAreaList();
    setStatus("SECTOR PURGED");
  });

  function renderAreaList() {
    areaList.innerHTML = "";
    if (areas.length === 0) {
      areaList.innerHTML = '<li class="empty-state">NO SECTORS CAPTURED</li>';
      return;
    }
    areas.slice().reverse().forEach(area => {
      const li = document.createElement("li");
      li.className = "area-item";
      const coordStr = area.cells.length === 1 ? area.cells[0] : area.cells[0] + "→" + area.cells[area.cells.length - 1];
      li.innerHTML = `<div class="coords">${coordStr}</div><div class="name">${escapeHtml(area.name)}</div><div class="cat">${categoryLabel(area.category)}</div>`;
      li.addEventListener("click", () => {
        selectedCells = new Set(area.cells);
        updateCellVisuals();
        showEditForm();
      });
      areaList.appendChild(li);
    });
  }

  function categoryLabel(cat) {
    return { wiese:"Wiese", sportflaeche:"Sportfläche", gebaeude:"Gebäude", strasse:"Straße", weg:"Weg", wald:"Wald / Bäume", hof:"Hof / Asphalt", sonstiges:"Sonstiges" }[cat] || cat;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
  }

  function save() { localStorage.setItem("bruchwiesen_areas", JSON.stringify(areas)); }

  document.getElementById("btnMulti").addEventListener("click", function() {
    multiMode = !multiMode;
    this.classList.toggle("active", multiMode);
    modeIndicator.textContent = multiMode ? "MULTI SELECT" : "SINGLE SELECT";
  });

  document.getElementById("btnExport").addEventListener("click", () => {
    const data = {
      version: 1,
      project: "BRUCHWIESEN Level 001",
      location: "Grundschule in den Bruchwiesen, Saarlouis-Beaumarais",
      coordinates: "49.31309 N, 6.72453 E",
      grid: { cols: COLS, rows: ROWS, labels: COL_LABELS },
      areas,
      exportedAt: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "bruchwiesen_level001_sectors.json";
    a.click();
    setStatus("DATA EXPORTED");
  });

  document.getElementById("btnImport").addEventListener("click", () => {
    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/json";
    input.onchange = e => {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (data.areas) {
            areas = data.areas;
            save(); updateCellVisuals(); renderAreaList();
            setStatus("DATA IMPORTED");
          }
        } catch { setStatus("IMPORT FAILED"); }
      };
      reader.readAsText(e.target.files[0]);
    };
    input.click();
  });

  document.getElementById("btnClear").addEventListener("click", () => {
    if (confirm("ALLE SEKTOREN UNWIDERRUFLICH LÖSCHEN?")) {
      areas = []; selectedCells.clear();
      save(); updateCellVisuals(); showEditForm(); renderAreaList();
      setStatus("ALL DATA PURGED");
    }
  });

  function fitToView() {
    const cw = mapContainer.clientWidth, ch = mapContainer.clientHeight;
    scale = Math.min(cw / imgNaturalWidth, ch / imgNaturalHeight) * 0.92;
    offsetX = (cw - imgNaturalWidth * scale) / 2;
    offsetY = (ch - imgNaturalHeight * scale) / 2;
    applyTransform();
  }

  function applyTransform() {
    mapWrapper.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    zoomText.textContent = "ZOOM " + Math.round(scale * 100) + "%";
  }

  mapContainer.addEventListener("wheel", e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = Math.min(Math.max(scale * delta, 0.15), 6);
    const rect = mapContainer.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    offsetX = mx - (mx - offsetX) * (newScale / scale);
    offsetY = my - (my - offsetY) * (newScale / scale);
    scale = newScale;
    applyTransform();
  }, { passive: false });

  mapContainer.addEventListener("mousedown", e => {
    if (e.target.closest(".cell")) return;
    isPanning = true;
    startX = e.clientX - offsetX;
    startY = e.clientY - offsetY;
  });
  window.addEventListener("mousemove", e => {
    if (!isPanning) return;
    offsetX = e.clientX - startX;
    offsetY = e.clientY - startY;
    applyTransform();
  });
  window.addEventListener("mouseup", () => isPanning = false);

  let lastTouchDist = 0;
  mapContainer.addEventListener("touchstart", e => {
    if (e.touches.length === 1 && !e.target.closest(".cell")) {
      isPanning = true;
      startX = e.touches[0].clientX - offsetX;
      startY = e.touches[0].clientY - offsetY;
    } else if (e.touches.length === 2) {
      isPanning = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastTouchDist = Math.hypot(dx, dy);
    }
  }, { passive: true });

  mapContainer.addEventListener("touchmove", e => {
    if (e.touches.length === 1 && isPanning) {
      offsetX = e.touches[0].clientX - startX;
      offsetY = e.touches[0].clientY - startY;
      applyTransform();
    } else if (e.touches.length === 2) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      scale = Math.min(Math.max(scale * (dist / lastTouchDist), 0.15), 6);
      lastTouchDist = dist;
      applyTransform();
    }
  }, { passive: false });

  mapContainer.addEventListener("touchend", () => isPanning = false);

  function setStatus(msg) { statusText.textContent = msg; }

  renderAreaList();
  setStatus("SYSTEM READY // AWAITING UPLINK");
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BRUCHWIESEN – Level 001 Map Editor</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --border: #2a2f3a;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --text: #e5e7eb;
    --text-dim: #9ca3af;
    --success: #22c55e;
    --danger: #ef4444;
    --cell-hover: rgba(59, 130, 246, 0.25);
    --cell-selected: rgba(59, 130, 246, 0.45);
    --cell-labeled: rgba(34, 197, 94, 0.35);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  button, .btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }

  button:active, .btn:active {
    background: var(--accent-hover);
  }

  button.secondary {
    background: #374151;
  }

  button.danger {
    background: var(--danger);
  }

  button.success {
    background: var(--success);
  }

  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  .map-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #111;
    touch-action: none;
  }

  #mapWrapper {
    position: absolute;
    transform-origin: 0 0;
    will-change: transform;
  }

  #satelliteImg {
    display: block;
    max-width: none;
    user-select: none;
    pointer-events: none;
  }

  #gridCanvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }

  .cell-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    pointer-events: auto;
  }

  .cell {
    border: 1px solid rgba(255,255,255,0.15);
    position: relative;
    cursor: pointer;
  }

  .cell:hover {
    background: var(--cell-hover);
  }

  .cell.selected {
    background: var(--cell-selected);
    border-color: var(--accent);
  }

  .cell.labeled {
    background: var(--cell-labeled);
  }

  .cell.selected.labeled {
    background: rgba(59, 130, 246, 0.55);
  }

  .cell-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 600;
    color: white;
    text-shadow: 0 1px 2px black;
    pointer-events: none;
    text-align: center;
    padding: 1px;
    overflow: hidden;
  }

  .sidebar {
    width: 320px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 14px;
  }

  .sidebar-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  .form-group {
    margin-bottom: 12px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  input[type="text"], textarea, select {
    width: 100%;
    background: #111827;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
  }

  textarea {
    min-height: 70px;
    resize: vertical;
  }

  .coord-display {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .area-list {
    list-style: none;
  }

  .area-item {
    background: #111827;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    cursor: pointer;
  }

  .area-item:hover {
    border-color: var(--accent);
  }

  .area-item .coords {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
  }

  .area-item .name {
    font-weight: 600;
    margin: 2px 0;
  }

  .area-item .cat {
    font-size: 11px;
    color: var(--text-dim);
  }

  .toolbar {
    display: flex;
    gap: 6px;
    padding: 10px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .toolbar button {
    flex: 1;
    min-width: 70px;
  }

  .status-bar {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 6px 12px;
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 30px 10px;
    font-size: 13px;
  }

  .upload-zone {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 20;
    gap: 16px;
    padding: 20px;
    text-align: center;
  }

  .upload-zone.hidden {
    display: none;
  }

  .upload-zone p {
    color: var(--text-dim);
    font-size: 14px;
    max-width: 280px;
  }

  #fileInput {
    display: none;
  }

  .mode-indicator {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    z-index: 10;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    .main {
      flex-direction: column;
    }
    .sidebar {
      width: 100%;
      height: 42%;
      border-left: none;
      border-top: 1px solid var(--border);
    }
    header h1 {
      font-size: 13px;
    }
  }
</style>
</head>
<body>

<header>
  <h1>BRUCHWIESEN · Level 001 Editor</h1>
  <div class="header-actions">
    <button class="secondary" id="btnMulti">Mehrfachauswahl</button>
    <button class="secondary" id="btnExport">JSON Export</button>
    <button class="secondary" id="btnImport">JSON Import</button>
    <button class="secondary" id="btnClear">Alles löschen</button>
  </div>
</header>

<div class="main">
  <div class="map-container" id="mapContainer">
    <div class="upload-zone" id="uploadZone">
      <p>Satellitenbild der Grundschule in den Bruchwiesen hier ablegen oder auswählen</p>
      <button id="btnLoadImage">Bild laden</button>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="mapWrapper">
      <img id="satelliteImg" alt="Satellitenkarte">
      <canvas id="gridCanvas"></canvas>
      <div class="cell-overlay" id="cellOverlay"></div>
    </div>

    <div class="mode-indicator" id="modeIndicator">Einzelfeld</div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-header">Bereich bearbeiten</div>
    <div class="sidebar-content" id="sidebarContent">
      <div class="empty-state" id="emptyState">
        Tippe auf ein Rasterfeld oder wähle mehrere Felder aus.
      </div>

      <div id="editForm" style="display:none;">
        <div class="coord-display" id="coordDisplay">—</div>

        <div class="form-group">
          <label>Bezeichnung</label>
          <input type="text" id="inputName" placeholder="z.B. Bolzplatz">
        </div>

        <div class="form-group">
          <label>Kategorie</label>
          <select id="inputCategory">
            <option value="wiese">Wiese</option>
            <option value="sportflaeche">Sportfläche</option>
            <option value="gebaeude">Gebäude</option>
            <option value="strasse">Straße</option>
            <option value="weg">Weg</option>
            <option value="wald">Wald / Bäume</option>
            <option value="hof">Hof / Asphalt</option>
            <option value="sonstiges">Sonstiges</option>
          </select>
        </div>

        <div class="form-group">
          <label>Beschreibung (optional)</label>
          <textarea id="inputDesc" placeholder="Zusätzliche Notizen..."></textarea>
        </div>

        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="success" id="btnSave" style="flex:1;">Speichern</button>
          <button class="danger" id="btnDelete" style="flex:1;">Löschen</button>
        </div>
      </div>

      <div style="margin-top:24px;">
        <div style="font-size:13px; font-weight:600; margin-bottom:8px;">Erfasste Bereiche</div>
        <ul class="area-list" id="areaList"></ul>
      </div>
    </div>
  </aside>
</div>

<div class="status-bar">
  <span id="statusText">Bereit</span>
  <span id="zoomText">100%</span>
</div>

<script>
(function() {
  const COLS = 10;
  const ROWS = 10;
  const COL_LABELS = "ABCDEFGHIJ".split("");

  let areas = JSON.parse(localStorage.getItem("bruchwiesen_areas") || "[]");
  let selectedCells = new Set();
  let multiMode = false;
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;
  let isPanning = false;
  let startX, startY;
  let imgNaturalWidth = 0;
  let imgNaturalHeight = 0;

  const mapContainer = document.getElementById("mapContainer");
  const mapWrapper = document.getElementById("mapWrapper");
  const satelliteImg = document.getElementById("satelliteImg");
  const gridCanvas = document.getElementById("gridCanvas");
  const cellOverlay = document.getElementById("cellOverlay");
  const uploadZone = document.getElementById("uploadZone");
  const fileInput = document.getElementById("fileInput");
  const modeIndicator = document.getElementById("modeIndicator");
  const coordDisplay = document.getElementById("coordDisplay");
  const inputName = document.getElementById("inputName");
  const inputCategory = document.getElementById("inputCategory");
  const inputDesc = document.getElementById("inputDesc");
  const editForm = document.getElementById("editForm");
  const emptyState = document.getElementById("emptyState");
  const areaList = document.getElementById("areaList");
  const statusText = document.getElementById("statusText");
  const zoomText = document.getElementById("zoomText");

  // ---------- Image loading ----------
  document.getElementById("btnLoadImage").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    loadImage(url);
  });

  // Drag & drop
  mapContainer.addEventListener("dragover", (e) => { e.preventDefault(); });
  mapContainer.addEventListener("drop", (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith("image/")) {
      loadImage(URL.createObjectURL(file));
    }
  });

  function loadImage(src) {
    satelliteImg.onload = () => {
      imgNaturalWidth = satelliteImg.naturalWidth;
      imgNaturalHeight = satelliteImg.naturalHeight;
      satelliteImg.style.width = imgNaturalWidth + "px";
      satelliteImg.style.height = imgNaturalHeight + "px";
      gridCanvas.width = imgNaturalWidth;
      gridCanvas.height = imgNaturalHeight;
      cellOverlay.style.width = imgNaturalWidth + "px";
      cellOverlay.style.height = imgNaturalHeight + "px";
      drawGrid();
      createCells();
      fitToView();
      uploadZone.classList.add("hidden");
      renderAreaList();
      updateCellVisuals();
      setStatus("Bild geladen – Raster aktiv");
    };
    satelliteImg.src = src;
  }

  // Try to auto-load if possible (for local testing with known file)
  // User will upload the provided satellite image.

  function drawGrid() {
    const ctx = gridCanvas.getContext("2d");
    ctx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1;
    const cellW = imgNaturalWidth / COLS;
    const cellH = imgNaturalHeight / ROWS;

    for (let i = 0; i <= COLS; i++) {
      const x = i * cellW;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, imgNaturalHeight);
      ctx.stroke();
    }
    for (let j = 0; j <= ROWS; j++) {
      const y = j * cellH;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(imgNaturalWidth, y);
      ctx.stroke();
    }

    // Labels
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let i = 0; i < COLS; i++) {
      ctx.fillText(COL_LABELS[i], i * cellW + cellW / 2, 12);
    }
    for (let j = 0; j < ROWS; j++) {
      ctx.fillText(String(j + 1), 12, j * cellH + cellH / 2);
    }
  }

  function createCells() {
    cellOverlay.innerHTML = "";
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.col = c;
        cell.dataset.row = r;
        cell.dataset.coord = COL_LABELS[c] + (r + 1);
        cell.addEventListener("click", (e) => onCellClick(e, cell));
        cellOverlay.appendChild(cell);
      }
    }
  }

  function onCellClick(e, cell) {
    e.stopPropagation();
    const coord = cell.dataset.coord;

    if (multiMode) {
      if (selectedCells.has(coord)) {
        selectedCells.delete(coord);
      } else {
        selectedCells.add(coord);
      }
    } else {
      selectedCells.clear();
      selectedCells.add(coord);
    }
    updateCellVisuals();
    showEditForm();
  }

  function updateCellVisuals() {
    document.querySelectorAll(".cell").forEach(cell => {
      const coord = cell.dataset.coord;
      cell.classList.toggle("selected", selectedCells.has(coord));
      const hasLabel = areas.some(a => a.cells.includes(coord));
      cell.classList.toggle("labeled", hasLabel);

      // Show short name if single-cell area
      let labelEl = cell.querySelector(".cell-label");
      if (!labelEl) {
        labelEl = document.createElement("div");
        labelEl.className = "cell-label";
        cell.appendChild(labelEl);
      }
      const area = areas.find(a => a.cells.length === 1 && a.cells[0] === coord);
      labelEl.textContent = area ? area.name : "";
    });
  }

  function showEditForm() {
    if (selectedCells.size === 0) {
      editForm.style.display = "none";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";
    editForm.style.display = "block";

    const coords = Array.from(selectedCells).sort();
    coordDisplay.textContent = coords.length === 1 ? coords[0] : coords[0] + " – " + coords[coords.length - 1] + ` (${coords.length} Felder)`;

    // Pre-fill if existing area matches exactly
    const existing = areas.find(a => 
      a.cells.length === selectedCells.size && 
      a.cells.every(c => selectedCells.has(c))
    );
    if (existing) {
      inputName.value = existing.name || "";
      inputCategory.value = existing.category || "sonstiges";
      inputDesc.value = existing.description || "";
    } else {
      inputName.value = "";
      inputCategory.value = "wiese";
      inputDesc.value = "";
    }
  }

  document.getElementById("btnSave").addEventListener("click", () => {
    if (selectedCells.size === 0) return;
    const name = inputName.value.trim() || "Unbenannt";
    const category = inputCategory.value;
    const description = inputDesc.value.trim();
    const cells = Array.from(selectedCells).sort();

    // Remove overlapping old areas that share cells
    areas = areas.filter(a => !a.cells.some(c => selectedCells.has(c)));

    areas.push({
      id: Date.now().toString(36),
      cells,
      name,
      category,
      description,
      created: new Date().toISOString()
    });

    save();
    updateCellVisuals();
    renderAreaList();
    setStatus(`Gespeichert: ${name}`);
  });

  document.getElementById("btnDelete").addEventListener("click", () => {
    if (selectedCells.size === 0) return;
    areas = areas.filter(a => !a.cells.some(c => selectedCells.has(c)));
    selectedCells.clear();
    save();
    updateCellVisuals();
    showEditForm();
    renderAreaList();
    setStatus("Bereich gelöscht");
  });

  function renderAreaList() {
    areaList.innerHTML = "";
    if (areas.length === 0) {
      areaList.innerHTML = '<li class="empty-state">Noch keine Bereiche erfasst</li>';
      return;
    }
    areas.slice().reverse().forEach(area => {
      const li = document.createElement("li");
      li.className = "area-item";
      const coordStr = area.cells.length === 1 
        ? area.cells[0] 
        : area.cells[0] + "–" + area.cells[area.cells.length - 1];
      li.innerHTML = `
        <div class="coords">${coordStr}</div>
        <div class="name">${escapeHtml(area.name)}</div>
        <div class="cat">${categoryLabel(area.category)}</div>
      `;
      li.addEventListener("click", () => {
        selectedCells = new Set(area.cells);
        updateCellVisuals();
        showEditForm();
      });
      areaList.appendChild(li);
    });
  }

  function categoryLabel(cat) {
    const map = {
      wiese: "Wiese",
      sportflaeche: "Sportfläche",
      gebaeude: "Gebäude",
      strasse: "Straße",
      weg: "Weg",
      wald: "Wald / Bäume",
      hof: "Hof / Asphalt",
      sonstiges: "Sonstiges"
    };
    return map[cat] || cat;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[m]);
  }

  function save() {
    localStorage.setItem("bruchwiesen_areas", JSON.stringify(areas));
  }

  // ---------- Multi mode ----------
  document.getElementById("btnMulti").addEventListener("click", function() {
    multiMode = !multiMode;
    this.textContent = multiMode ? "Einzelfeld" : "Mehrfachauswahl";
    this.classList.toggle("success", multiMode);
    modeIndicator.textContent = multiMode ? "Mehrfachauswahl aktiv" : "Einzelfeld";
    if (!multiMode) {
      // keep current selection
    }
  });

  // ---------- Export / Import ----------
  document.getElementById("btnExport").addEventListener("click", () => {
    const data = {
      version: 1,
      project: "BRUCHWIESEN Level 001",
      location: "Grundschule in den Bruchwiesen, Saarlouis-Beaumarais",
      coordinates: "49.31309 N, 6.72453 E",
      grid: { cols: COLS, rows: ROWS, labels: COL_LABELS },
      areas: areas,
      exportedAt: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "bruchwiesen_level001_areas.json";
    a.click();
    URL.revokeObjectURL(url);
    setStatus("JSON exportiert");
  });

  document.getElementById("btnImport").addEventListener("click", () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "application/json";
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (data.areas) {
            areas = data.areas;
            save();
            updateCellVisuals();
            renderAreaList();
            setStatus("JSON importiert");
          }
        } catch (err) {
          setStatus("Import fehlgeschlagen");
        }
      };
      reader.readAsText(file);
    };
    input.click();
  });

  document.getElementById("btnClear").addEventListener("click", () => {
    if (confirm("Wirklich alle erfassten Bereiche löschen?")) {
      areas = [];
      selectedCells.clear();
      save();
      updateCellVisuals();
      showEditForm();
      renderAreaList();
      setStatus("Alles gelöscht");
    }
  });

  // ---------- Zoom & Pan ----------
  function fitToView() {
    const containerW = mapContainer.clientWidth;
    const containerH = mapContainer.clientHeight;
    const scaleX = containerW / imgNaturalWidth;
    const scaleY = containerH / imgNaturalHeight;
    scale = Math.min(scaleX, scaleY) * 0.95;
    offsetX = (containerW - imgNaturalWidth * scale) / 2;
    offsetY = (containerH - imgNaturalHeight * scale) / 2;
    applyTransform();
  }

  function applyTransform() {
    mapWrapper.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    zoomText.textContent = Math.round(scale * 100) + "%";
  }

  // Mouse wheel zoom
  mapContainer.addEventListener("wheel", (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = Math.min(Math.max(scale * delta, 0.2), 5);
    const rect = mapContainer.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    offsetX = mx - (mx - offsetX) * (newScale / scale);
    offsetY = my - (my - offsetY) * (newScale / scale);
    scale = newScale;
    applyTransform();
  }, { passive: false });

  // Pan
  mapContainer.addEventListener("mousedown", (e) => {
    if (e.target.closest(".cell")) return;
    isPanning = true;
    startX = e.clientX - offsetX;
    startY = e.clientY - offsetY;
  });
  window.addEventListener("mousemove", (e) => {
    if (!isPanning) return;
    offsetX = e.clientX - startX;
    offsetY = e.clientY - startY;
    applyTransform();
  });
  window.addEventListener("mouseup", () => { isPanning = false; });

  // Touch support
  let lastTouchDist = 0;
  mapContainer.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1 && !e.target.closest(".cell")) {
      isPanning = true;
      startX = e.touches[0].clientX - offsetX;
      startY = e.touches[0].clientY - offsetY;
    } else if (e.touches.length === 2) {
      isPanning = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastTouchDist = Math.hypot(dx, dy);
    }
  }, { passive: true });

  mapContainer.addEventListener("touchmove", (e) => {
    if (e.touches.length === 1 && isPanning) {
      offsetX = e.touches[0].clientX - startX;
      offsetY = e.touches[0].clientY - startY;
      applyTransform();
    } else if (e.touches.length === 2) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      const delta = dist / lastTouchDist;
      const newScale = Math.min(Math.max(scale * delta, 0.2), 5);
      scale = newScale;
      lastTouchDist = dist;
      applyTransform();
    }
  }, { passive: false });

  mapContainer.addEventListener("touchend", () => {
    isPanning = false;
  });

  function setStatus(msg) {
    statusText.textContent = msg;
  }

  // Init
  renderAreaList();
  setStatus("Bild laden, um zu starten");
})();
</script>
</body>
</html>
